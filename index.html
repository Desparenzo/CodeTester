
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Nokia Bounce - Retro Edition</title>
<style>
:root {
  --green:#a8c66c;
  --dark:#253b21;
  --light:#d9e9a0;
  --focus:#fff36a;
}
*{box-sizing:border-box}
body{
 margin:0;background:#172318;color:#e8f3d0;
 font-family:Arial,sans-serif;overflow:hidden;
 user-select:none;
}
button{
 background:#344c2d;color:white;border:2px solid #799653;
 padding:12px 20px;border-radius:8px;
 font-size:16px;font-weight:bold;cursor:pointer;
}
button:focus-visible{
 outline:4px solid var(--focus);
 outline-offset:4px;
 background:#617b39;
}
#app{
 width:100vw;height:100dvh;display:flex;
 flex-direction:column;align-items:center;
 padding:10px;gap:8px;
}
header{
 width:min(900px,100%);display:flex;
 justify-content:space-between;align-items:center;
 font-weight:bold;
}
h1{font-size:clamp(18px,4vw,27px);margin:4px}
#hud{display:flex;gap:15px;font-size:14px}
#gameFrame{
 width:min(900px,100%);flex:1;min-height:0;
 position:relative;border:5px solid #829c58;
 border-radius:12px;overflow:hidden;
 background:var(--green);
 box-shadow:0 0 25px #0008;
}
canvas{width:100%;height:100%;display:block}
#overlay{
 position:absolute;inset:0;
 background:#172318d9;
 display:flex;align-items:center;justify-content:center;
 flex-direction:column;gap:14px;text-align:center;
 padding:20px;
}
#overlay.hidden{display:none}
#overlay h2{font-size:clamp(25px,5vw,42px);margin:0;color:#e7f4a7}
#overlay p{max-width:450px;line-height:1.5}
#menuButtons{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
#bottom{
 display:flex;justify-content:space-between;align-items:center;
 width:min(900px,100%);gap:8px;font-size:12px;
}
#bottom button{padding:8px 12px;font-size:13px}
#controls{
 display:flex;gap:7px;align-items:center;
}
@media(max-width:500px){
 #hud{gap:7px;font-size:11px}
 #bottom{font-size:10px}
 button{padding:10px 13px}
}
</style>
</head>
<body>
<div id="app">
<header>
 <h1>🔴 NOKIA BOUNCE</h1>
 <div id="hud">
  <span>LEVEL <b id="level">1</b></span>
  <span>SCORE <b id="score">0</b></span>
  <span>❤️ <b id="lives">3</b></span>
 </div>
</header>

<div id="gameFrame">
 <canvas id="game"></canvas>
 <div id="overlay">
  <h2 id="overlayTitle">NOKIA BOUNCE</h2>
  <p id="overlayText">A classic bouncing adventure. Collect coins, dodge hazards and reach the exit!</p>
  <div id="menuButtons">
   <button id="startBtn">▶ START GAME</button>
   <button id="helpBtn">CONTROLS</button>
  </div>
 </div>
</div>

<div id="bottom">
 <span>ARROWS: MOVE / JUMP · ENTER: SELECT · ESC: PAUSE</span>
 <div id="controls">
  <button id="pauseBtn">Ⅱ PAUSE</button>
  <button id="restartBtn">↻ RESTART</button>
 </div>
</div>
</div>

<script>
(()=>{
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const overlay=document.getElementById("overlay");
const title=document.getElementById("overlayTitle");
const message=document.getElementById("overlayText");
const buttons=document.getElementById("menuButtons");

const hud={
 level:document.getElementById("level"),
 score:document.getElementById("score"),
 lives:document.getElementById("lives")
};

let W=900,H=500;
let running=false,paused=false,gameOver=false;
let level=1,score=0,lives=3;
let last=0,acc=0;
const keys={};
let player,platforms,coins,hazards,exit,particles;
let camera=0;
let audioCtx=null;
let focusIndex=0;

const levels=[
 {
  length:1800,
  platforms:[
   [0,430,380,70],[450,400,220,100],
   [740,360,220,140],[1030,410,250,90],
   [1380,370,420,130],
   [170,340,130,20],[520,300,100,20],
   [850,260,120,20],[1130,320,100,20]
  ],
  coins:[[200,300],[550,260],[880,220],[1150,280],[1450,320],[1580,320]],
  hazards:[[690,390,35,10],[1290,400,45,10]]
 },
 {
  length:2200,
  platforms:[
   [0,430,280,70],[350,390,170,110],
   [600,330,180,170],[880,390,170,110],
   [1150,320,170,180],[1430,380,200,120],
   [1720,330,480,170],
   [150,340,100,20],[420,290,100,20],
   [690,240,100,20],[960,290,100,20],
   [1230,230,100,20],[1530,270,100,20]
  ],
  coins:[[180,300],[450,250],[720,200],[990,250],[1260,190],[1560,230],[1850,290]],
  hazards:[[540,380,35,10],[1080,380,40,10],[1640,370,35,10]]
 },
 {
  length:2600,
  platforms:[
   [0,430,260,70],[340,380,150,120],
   [570,330,140,170],[800,390,150,110],
   [1050,320,150,180],[1300,380,150,120],
   [1550,300,170,200],[1830,360,160,140],
   [2110,320,490,180],
   [150,320,100,20],[400,260,90,20],
   [650,210,90,20],[900,260,90,20],
   [1150,200,90,20],[1400,250,90,20],
   [1650,190,90,20],[1920,250,90,20]
  ],
  coins:[[180,280],[440,220],[680,170],[930,220],[1180,160],[1430,210],[1680,150],[1950,210],[2250,270]],
  hazards:[[510,370,35,10],[750,320,35,10],[1000,380,35,10],[1500,370,35,10],[2040,310,35,10]]
 }
];

function resize(){
 const r=canvas.getBoundingClientRect();
 const d=Math.min(devicePixelRatio||1,2);
 canvas.width=Math.max(1,Math.floor(r.width*d));
 canvas.height=Math.max(1,Math.floor(r.height*d));
 W=900;H=500;
}
window.addEventListener("resize",resize);
resize();

function makePlayer(){
 return {x:55,y:350,vx:0,vy:0,r:17,onGround:false,invincible:0};
}

function loadLevel(n){
 const data=levels[(n-1)%levels.length];
 platforms=data.platforms.map(p=>({x:p[0],y:p[1],w:p[2],h:p[3]}));
 coins=data.coins.map(c=>({x:c[0],y:c[1],taken:false}));
 hazards=data.hazards.map(h=>({x:h[0],y:h[1],w:h[2],h:h[3]}));
 exit={x:data.length-75,y:345,w:42,h:75};
 player=makePlayer();
 camera=0;
 hud.level.textContent=n;
}

function sound(freq=440,duration=.08){
 try{
  audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume();
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.frequency.value=freq;
  g.gain.value=.045;
  o.connect(g);g.connect(audioCtx.destination);
  o.start();g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+duration);
  o.stop(audioCtx.currentTime+duration);
 }catch(e){}
}

function start(){
 level=1;score=0;lives=3;
 loadLevel(level);
 gameOver=false;paused=false;running=true;
 hideOverlay();
 updateHUD();
 sound(600);
 last=performance.now();
 requestAnimationFrame(loop);
}

function updateHUD(){
 hud.score.textContent=score;
 hud.lives.textContent=lives;
}

function showOverlay(t,m,items){
 running=false;paused=true;
 title.textContent=t;
 message.textContent=m;
 buttons.innerHTML="";
 items.forEach(item=>{
  const b=document.createElement("button");
  b.textContent=item.text;
  b.onclick=item.action;
  buttons.appendChild(b);
 });
 overlay.classList.remove("hidden");
 focusFirst();
}

function hideOverlay(){
 overlay.classList.add("hidden");
}

function focusFirst(){
 const b=overlay.querySelector("button");
 if(b)b.focus();
}

function restart(){
 loadLevel(level);
 paused=false;running=true;
 hideOverlay();
 last=performance.now();
 requestAnimationFrame(loop);
}

function pause(){
 if(!running)return;
 paused=true;running=false;
 showOverlay("PAUSED","Take a breather. Your adventure is waiting.",[
  {text:"▶ RESUME",action:()=>{paused=false;running=true;hideOverlay();last=performance.now();requestAnimationFrame(loop)}},
  {text:"↻ RESTART",action:restart},
  {text:"MAIN MENU",action:mainMenu}
 ]);
}

function mainMenu(){
 paused=false;
 showOverlay("NOKIA BOUNCE","Ready for another adventure?",[
  {text:"▶ START GAME",action:start},
  {text:"CONTROLS",action:help}
 ]);
}

function help(){
 showOverlay("CONTROLS",
 "D-pad / Arrow keys: Move. OK / Enter: Select. Space: Jump. Back / Escape: Pause or close. Play/Pause: Pause. Next track: Jump. Previous track: Restart.",
 [
  {text:"BACK",action:mainMenu},
  {text:"▶ PLAY",action:start}
 ]);
}

function loseLife(){
 if(player.invincible>0)return;
 lives--;updateHUD();sound(130,.2);
 if(lives<=0){
  showOverlay("GAME OVER","Final score: "+score,[
   {text:"TRY AGAIN",action:start},
   {text:"MAIN MENU",action:mainMenu}
  ]);
 }else{
  player.x=Math.max(10,camera+55);
  player.y=300;player.vx=0;player.vy=0;
  player.invincible=1.5;
 }
}

function nextLevel(){
 level++;
 if(level>levels.length){
  showOverlay("YOU WIN!","All levels completed! Final score: "+score,[
   {text:"PLAY AGAIN",action:start},
   {text:"MAIN MENU",action:mainMenu}
  ]);
 }else{
  loadLevel(level);
  sound(800,.25);
 }
}

function update(dt){
 const left=keys.ArrowLeft||keys.KeyA;
 const right=keys.ArrowRight||keys.KeyD;
 const jump=keys.Space||keys.ArrowUp||keys.KeyW;

 const acceleration=1050;
 const maxSpeed=260;

 if(left)player.vx-=acceleration*dt;
 if(right)player.vx+=acceleration*dt;
 if(!left&&!right)player.vx*=Math.pow(.001,dt);

 player.vx=Math.max(-maxSpeed,Math.min(maxSpeed,player.vx));

 if(jump&&player.onGround){
  player.vy=-570;
  player.onGround=false;
  sound(320);
 }

 player.vy+=1450*dt;
 player.vy=Math.min(player.vy,850);

 const oldY=player.y;
 player.x+=player.vx*dt;
 player.y+=player.vy*dt;
 player.onGround=false;

 const data=levels[(level-1)%levels.length];
 player.x=Math.max(0,Math.min(data.length-player.r,player.x));

 for(const p of platforms){
  if(player.x+player.r>p.x&&player.x-player.r<p.x+p.w){
   if(oldY+player.r<=p.y&&player.y+player.r>=p.y&&player.vy>=0){
    player.y=p.y-player.r;
    player.vy=0;
    player.onGround=true;
   }
  }
 }

 if(player.y>H+100)loseLife();

 for(const c of coins){
  if(!c.taken&&Math.hypot(player.x-c.x,player.y-c.y)<27){
   c.taken=true;score+=10;updateHUD();sound(900);
  }
 }

 for(const h of hazards){
  if(player.x+player.r>h.x&&player.x-player.r<h.x+h.w&&
     player.y+player.r>h.y-12&&player.y-player.r<h.y+h.h){
   loseLife();
  }
 }

 if(player.x+player.r>exit.x&&player.y+player.r>exit.y&&player.y-player.r<exit.y+exit.h){
  score+=100;updateHUD();nextLevel();
 }

 if(player.invincible>0)player.invincible-=dt;
 camera=Math.max(0,Math.min(data.length-W,player.x-W*.35));
}

function draw(){
 const scaleX=canvas.width/W;
 const scaleY=canvas.height/H;
 ctx.setTransform(scaleX,0,0,scaleY,0,0);
 ctx.clearRect(0,0,W,H);

 // Retro background
 ctx.fillStyle="#a8c66c";
 ctx.fillRect(0,0,W,H);

 // Decorative hills
 ctx.fillStyle="#97b65f";
 for(let i=0;i<7;i++){
  ctx.beginPath();
  ctx.arc((i*180-camera*.15)%1100,480,100,Math.PI,0);
  ctx.fill();
 }

 ctx.save();
 ctx.translate(-camera,0);

 // Platforms
 for(const p of platforms){
  ctx.fillStyle="#455c32";
  ctx.fillRect(p.x,p.y,p.w,p.h);
  ctx.fillStyle="#d3e99a";
  ctx.fillRect(p.x,p.y,p.w,7);
  ctx.fillStyle="#78974a";
  for(let x=p.x+15;x<p.x+p.w-5;x+=30){
   ctx.fillRect(x,p.y+18,10,5);
  }
 }

 // Coins
 for(const c of coins){
  if(c.taken)continue;
  ctx.fillStyle="#fff36a";
  ctx.beginPath();
  ctx.arc(c.x,c.y,9,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle="#8c7222";
  ctx.lineWidth=2;
  ctx.stroke();
 }

 // Hazards
 for(const h of hazards){
  ctx.fillStyle="#78372a";
  ctx.fillRect(h.x,h.y,h.w,h.h);
  ctx.fillStyle="#df5037";
  for(let x=h.x;x<h.x+h.w;x+=12){
   ctx.beginPath();
   ctx.moveTo(x,h.y);
   ctx.lineTo(x+6,h.y-17);
   ctx.lineTo(x+12,h.y);
   ctx.fill();
  }
 }

 // Exit
 ctx.fillStyle="#40562b";
 ctx.fillRect(exit.x,exit.y,exit.w,exit.h);
 ctx.fillStyle="#e4eea5";
 ctx.fillRect(exit.x+7,exit.y+7,exit.w-14,exit.h-14);
 ctx.fillStyle="#40562b";
 ctx.font="bold 12px Arial";
 ctx.fillText("EXIT",exit.x+5,exit.y+40);

 // Ball
 if(player.invincible<=0||Math.floor(performance.now()/100)%2===0){
  ctx.fillStyle="#b51e27";
  ctx.beginPath();
  ctx.arc(player.x,player.y,player.r,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle="#ef6260";
  ctx.beginPath();
  ctx.arc(player.x-6,player.y-7,6,0,Math.PI*2);
  ctx.fill();
  ctx.strokeStyle="#74171d";
  ctx.lineWidth=3;
  ctx.stroke();
 }
 ctx.restore();

 // Instructions
 ctx.fillStyle="#344c2d";
 ctx.font="bold 13px Arial";
 ctx.fillText("BOUNCE ADVENTURE",15,25);
}

function loop(time){
 if(!running)return;
 let dt=Math.min((time-last)/1000,.035);
 last=time;
 update(dt);
 draw();
 if(running)requestAnimationFrame(loop);
}

// Keyboard and remote controls
function activateFocused(){
 const el=document.activeElement;
 if(el&&el.tagName==="BUTTON")el.click();
}

function handleBack(){
 if(!overlay.classList.contains("hidden")){
  if(paused)mainMenu();
  else mainMenu();
 }else pause();
}

window.addEventListener("keydown",e=>{
 const k=e.key;
 const code=e.code;

 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," ","Enter","Backspace"].includes(k)){
  e.preventDefault();
 }

 if(k==="Escape"||k==="Backspace"||k==="BrowserBack"){
  handleBack();return;
 }

 if(k==="Enter"||k==="NumpadEnter"){
  if(!overlay.classList.contains("hidden"))activateFocused();
  else if(!running)start();
  return;
 }

 if(k===" "||code==="Space"){
  if(!running){
   if(!overlay.classList.contains("hidden"))activateFocused();
   else start();
  }else keys.Space=true;
  return;
 }

 if(k==="ArrowLeft"||k==="ArrowRight"||k==="ArrowUp"||k==="ArrowDown"){
  if(!overlay.classList.contains("hidden")){
   navigateFocus(k);return;
  }
 }

 if(k==="ArrowLeft"||k==="ArrowRight"||k==="ArrowUp"||k==="ArrowDown"||
    code==="KeyA"||code==="KeyD"||code==="KeyW"){
  if(running)keys[k]=true;
 }

 if(code==="MediaPlayPause"){
  if(running)pause();
  else if(paused)resumeGame();
 }
 if(code==="MediaTrackNext"||code==="MediaNextTrack"){
  if(running)keys.Space=true;
 }
 if(code==="MediaTrackPrevious"||code==="MediaPreviousTrack"){
  if(running)restart();
 }
});

function resumeGame(){
 paused=false;running=true;hideOverlay();
 last=performance.now();requestAnimationFrame(loop);
}

window.addEventListener("keyup",e=>{
 keys[e.key]=false;
 keys[e.code]=false;
});

function navigateFocus(key){
 const all=[...overlay.querySelectorAll("button")];
 if(!all.length)return;
 let i=all.indexOf(document.activeElement);
 if(i<0)i=0;
 if(key==="ArrowRight"||key==="ArrowDown")i=(i+1)%all.length;
 else i=(i-1+all.length)%all.length;
 all[i].focus();
}

window.addEventListener("blur",()=>{
 Object.keys(keys).forEach(k=>keys[k]=false);
});

// TV remote key mapping
document.addEventListener("keydown",e=>{
 if(e.key==="MediaPlayPause"){
  e.preventDefault();
 }
});

document.getElementById("startBtn").onclick=start;
document.getElementById("helpBtn").onclick=help;
document.getElementById("pauseBtn").onclick=()=>running?pause():resumeGame();
document.getElementById("restartBtn").onclick=restart;

canvas.addEventListener("contextmenu",e=>e.preventDefault());

loadLevel(1);
draw();
focusFirst();

})();
</script>
</body>
</html>
