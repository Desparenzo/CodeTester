
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retro Game Vault</title>

<style>
:root {
  --bg:#080d18;
  --panel:#121d30;
  --panel2:#1b2940;
  --accent:#745cff;
  --text:#f4f6ff;
  --muted:#9ba9c2;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}
header{
  padding:20px;
  background:#101a2c;
  border-bottom:1px solid #263653;
  position:sticky;
  top:0;
  z-index:10;
}
h1{margin:0 0 8px;font-size:25px}
.subtitle{color:var(--muted);font-size:13px}
.toolbar{
  display:flex;
  gap:10px;
  margin-top:16px;
  flex-wrap:wrap;
}
input,select,button{
  padding:12px;
  border-radius:9px;
  border:1px solid #344461;
  background:#18253a;
  color:white;
  font-size:14px;
}
input{flex:1;min-width:150px}
button{cursor:pointer}
button:hover{background:#34466a}
button:focus-visible,.card:focus-visible{
  outline:3px solid #a995ff;
  outline-offset:3px;
}
main{padding:20px}
#status{color:var(--muted);margin-bottom:18px}
#games{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
  gap:14px;
}
.card{
  background:var(--panel);
  border:1px solid #253651;
  border-radius:12px;
  padding:16px 10px;
  min-height:110px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  cursor:pointer;
  transition:.15s;
}
.card:hover{transform:translateY(-3px);background:var(--panel2)}
.icon{font-size:32px;margin-bottom:10px}
.name{font-weight:bold;font-size:13px;overflow-wrap:anywhere}
#player{
  display:none;
  position:fixed;
  inset:0;
  background:#000;
  z-index:100;
  flex-direction:column;
}
#playerbar{
  height:52px;
  background:#111c30;
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 10px;
}
#gameTitle{
  flex:1;
  font-weight:bold;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}
#gameFrame{flex:1;width:100%;border:0;background:white}
#empty{
  display:none;
  text-align:center;
  padding:50px 15px;
  color:var(--muted);
}
.small{font-size:12px;color:var(--muted)}
@media(max-width:500px){
  header{padding:14px}
  main{padding:12px}
  #games{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card{min-height:100px}
}
</style>
</head>

<body>

<header>
  <h1>🎮 Retro Game Vault</h1>
  <div class="subtitle">352+ HTML games • Powered by GitHub</div>

  <div class="toolbar">
    <input id="search" placeholder="Search games..." autocomplete="off">
    <select id="sort">
      <option value="az">A - Z</option>
      <option value="za">Z - A</option>
    </select>
    <button onclick="loadGames()">↻ Refresh</button>
  </div>
</header>

<main>
  <div id="status">Connecting to GitHub...</div>
  <div id="games"></div>
  <div id="empty">No games found.</div>
</main>

<div id="player">
  <div id="playerbar">
    <button onclick="closeGame()">← Back</button>
    <div id="gameTitle">Game</div>
    <button onclick="newTab()">↗</button>
    <button onclick="fullscreen()">⛶</button>
  </div>
  <iframe id="gameFrame"
    allow="autoplay; fullscreen; gamepad; clipboard-read; clipboard-write"
    allowfullscreen>
  </iframe>
</div>

<script>
const API =
"https://api.github.com/repos/CoolDude2349/Offline-HTML-Games-Pack/git/trees/master?recursive=1";

const RAW =
"https://raw.githubusercontent.com/CoolDude2349/Offline-HTML-Games-Pack/master/";

let allGames=[];
let currentURL="";

const gamesEl=document.getElementById("games");
const statusEl=document.getElementById("status");
const searchEl=document.getElementById("search");
const sortEl=document.getElementById("sort");
const frame=document.getElementById("gameFrame");

function titleFromPath(path){
  let name=path.split("/").pop().replace(/\.html?$/i,"");
  return name
    .replace(/[-_]/g," ")
    .replace(/\b\w/g,c=>c.toUpperCase());
}

async function loadGames(){
  statusEl.textContent="Loading game collection...";
  gamesEl.innerHTML="";
  document.getElementById("empty").style.display="none";

  try{
    const response=await fetch(API);

    if(!response.ok)
      throw new Error("GitHub API error: "+response.status);

    const data=await response.json();

    allGames=data.tree
      .filter(item=>
        item.type==="blob" &&
        /^offline\/.+\.html?$/i.test(item.path)
      )
      .map(item=>({
        name:titleFromPath(item.path),
        path:item.path,
        url:RAW+item.path.split("/").map(encodeURIComponent).join("/")
      }));

    statusEl.textContent=
      allGames.length+" games available";

    renderGames();

  }catch(error){
    statusEl.textContent=
      "Could not load games. Check your internet connection or GitHub API limit.";
    console.error(error);
  }
}

function renderGames(){
  const query=searchEl.value.toLowerCase().trim();

  let filtered=allGames.filter(game=>
    game.name.toLowerCase().includes(query)
  );

  filtered.sort((a,b)=>
    sortEl.value==="az"
      ? a.name.localeCompare(b.name)
      : b.name.localeCompare(a.name)
  );

  gamesEl.innerHTML="";

  filtered.forEach(game=>{
    const card=document.createElement("div");
    card.className="card";
    card.tabIndex=0;
    card.setAttribute("role","button");
    card.innerHTML=`
      <div class="icon">🎮</div>
      <div class="name"></div>
    `;
    card.querySelector(".name").textContent=game.name;

    card.onclick=()=>playGame(game);
    card.onkeydown=e=>{
      if(e.key==="Enter"||e.key===" "){
        e.preventDefault();
        playGame(game);
      }
    };

    gamesEl.appendChild(card);
  });

  document.getElementById("empty").style.display=
    filtered.length?"none":"block";

  statusEl.textContent=
    filtered.length+" of "+allGames.length+" games";
}

function playGame(game){
  currentURL=game.url;

  document.getElementById("gameTitle").textContent=game.name;
  document.getElementById("player").style.display="flex";

  frame.src=game.url;
}

function closeGame(){
  frame.src="about:blank";
  document.getElementById("player").style.display="none";
}

function newTab(){
  if(currentURL) window.open(currentURL,"_blank");
}

function fullscreen(){
  const player=document.getElementById("player");

  if(!document.fullscreenElement){
    player.requestFullscreen?.();
  }else{
    document.exitFullscreen?.();
  }
}

searchEl.addEventListener("input",renderGames);
sortEl.addEventListener("change",renderGames);

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){
    if(document.getElementById("player").style.display==="flex"){
      closeGame();
    }
  }
});

loadGames();
</script>

</body>
</html>
