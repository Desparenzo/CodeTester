
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Desparenzo TV</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #090b13;
    color: white;
    font-family: Arial, sans-serif;
}

#app {
    width: 100%;
    height: 100%;
    padding: 4vh 6vw;
    display: flex;
    flex-direction: column;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 12%;
}

.logo {
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: 1px;
}

.logo span {
    color: #927cff;
}

#clock {
    font-size: 1.2rem;
    color: #a4a9bc;
}

main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.intro {
    margin-bottom: 42px;
}

.intro h1 {
    font-size: 3.2rem;
    font-weight: 800;
    margin-bottom: 12px;
}

.intro p {
    font-size: 1.2rem;
    color: #9299ae;
}

.options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 30px;
}

.option {
    height: 310px;
    border-radius: 25px;
    padding: 35px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    border: 3px solid transparent;
    transition: .18s ease;
    cursor: pointer;
    outline: none;
    position: relative;
    overflow: hidden;
}

.browser {
    background:
        radial-gradient(circle at 85% 15%, #536bcf88, transparent 45%),
        linear-gradient(135deg, #18294a, #11192d);
}

.games {
    background:
        radial-gradient(circle at 85% 15%, #a14cc588, transparent 45%),
        linear-gradient(135deg, #392044, #1b162c);
}

.option.focused {
    border-color: #a99aff;
    transform: scale(1.045);
    box-shadow: 0 15px 50px #0009;
}

.icon {
    font-size: 5rem;
}

.option h2 {
    font-size: 2rem;
    margin-bottom: 10px;
}

.option p {
    font-size: 1.05rem;
    color: #c2c7d7;
}

.arrow {
    position: absolute;
    right: 35px;
    bottom: 35px;
    font-size: 2rem;
    color: #ffffff99;
}

footer {
    height: 10%;
    display: flex;
    align-items: end;
    justify-content: space-between;
    color: #747d94;
    font-size: .95rem;
}

.controls {
    display: flex;
    gap: 25px;
}

.controls b {
    background: #24283a;
    padding: 7px 11px;
    border-radius: 6px;
    color: white;
    margin-right: 5px;
}
</style>
</head>

<body>

<div id="app">

<header>
    <div class="logo">DESPARENZO<span> TV</span></div>
    <div id="clock"></div>
</header>

<main>

    <div class="intro">
        <h1>Your TV. Your World.</h1>
        <p>What would you like to do today?</p>
    </div>

    <div class="options">

        <div class="option browser" data-action="browser">
            <div class="icon">🌐</div>
            <div>
                <h2>Browse Internet</h2>
                <p>Explore websites and discover the internet.</p>
            </div>
            <div class="arrow">➜</div>
        </div>

        <div class="option games" data-action="apps">
            <div class="icon">🎮</div>
            <div>
                <h2>Apps & Games</h2>
                <p>Your applications, games and entertainment.</p>
            </div>
            <div class="arrow">➜</div>
        </div>

    </div>

</main>

<footer>
    <div>DESPARENZO TV · PERSONAL ENTERTAINMENT HUB</div>

    <div class="controls">
        <span><b>↔</b> Navigate</span>
        <span><b>OK</b> Select</span>
        <span><b>BACK</b> Return</span>
    </div>
</footer>

</div>

<script>
const options = [...document.querySelectorAll('.option')];

let selected = 0;

function focusOption(index) {
    selected = Math.max(0, Math.min(index, options.length - 1));

    options.forEach((option, i) => {
        option.classList.toggle('focused', i === selected);
    });
}

function activate() {
    const action = options[selected].dataset.action;

    if (action === 'browser') {
        alert('Browse Internet - Coming Soon');
    }

    if (action === 'apps') {
        alert('Apps & Games - Coming Soon');
    }
}

function back() {
    focusOption(0);
}

document.addEventListener('keydown', e => {

    if ([
        'ArrowLeft',
        'ArrowRight',
        'ArrowUp',
        'ArrowDown',
        'Enter',
        'Backspace',
        'Escape'
    ].includes(e.key)) {
        e.preventDefault();
    }

    switch (e.key) {

        case 'ArrowRight':
        case 'ArrowDown':
            focusOption(1);
            break;

        case 'ArrowLeft':
        case 'ArrowUp':
            focusOption(0);
            break;

        case 'Enter':
            if (!e.repeat) activate();
            break;

        case 'Backspace':
        case 'Escape':
            if (!e.repeat) back();
            break;
    }
});

options.forEach((option, index) => {

    option.addEventListener('mouseenter', () => {
        focusOption(index);
    });

    option.addEventListener('click', () => {
        focusOption(index);
        activate();
    });

});

function updateClock() {
    document.getElementById('clock').textContent =
        new Date().toLocaleString([], {
            weekday: 'short',
            day: 'numeric',
            month: 'short',
            hour: '2-digit',
            minute: '2-digit'
        });
}

updateClock();
setInterval(updateClock, 1000);

focusOption(0);
</script>

</body>
</html>
