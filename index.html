<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MediaBox</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #101114;
    --panel: #1b1d22;
    --panel2: #252830;
    --text: #f4f5f7;
    --muted: #a6a9b2;
    --accent: #8b7cff;
    --border: #343740;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  button, input { font: inherit; }

  button {
    border: 0;
    color: var(--text);
    background: var(--panel2);
    border-radius: 12px;
    padding: 11px 15px;
    cursor: pointer;
  }

  button:disabled {
    opacity: .4;
    cursor: default;
  }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .hidden { display: none !important; }

  #loadingScreen {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    text-align: center;
  }

  .loadingBox { max-width: 460px; }

  .logo {
    font-size: clamp(42px, 10vw, 70px);
    font-weight: 800;
    letter-spacing: -3px;
    margin-bottom: 8px;
  }

  .logo span { color: var(--accent); }

  .subtitle, .muted {
    color: var(--muted);
    line-height: 1.5;
  }

  .startActions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: 24px;
  }

  .primary {
    background: var(--accent);
    color: white;
    font-weight: 700;
  }

  #app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    background: rgba(16,17,20,.92);
    position: sticky;
    top: 0;
    z-index: 5;
    backdrop-filter: blur(12px);
  }

  .brand {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -1px;
    white-space: nowrap;
  }

  .brand span { color: var(--accent); }

  .headerActions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .smallButton {
    padding: 9px 12px;
    font-size: 14px;
  }

  main {
    width: 100%;
    max-width: 1500px;
    margin: 0 auto;
    padding: 20px;
    flex: 1;
  }

  .sectionHeading {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin: 6px 0 16px;
  }

  h1, h2, p { margin-top: 0; }
  h1 { font-size: clamp(24px, 5vw, 34px); margin-bottom: 6px; }
  h2 { font-size: 20px; margin-bottom: 0; }

  #categoryGrid, #mediaGrid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
    gap: 14px;
  }

  .categoryCard, .mediaCard {
    min-width: 0;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 15px;
    cursor: pointer;
    text-align: left;
    padding: 0;
  }

  .categoryArt {
    aspect-ratio: 1.35;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 20% 20%, rgba(139,124,255,.55), transparent 45%),
      linear-gradient(135deg, #292b36, #17181d);
    font-size: 48px;
  }

  .categoryInfo, .mediaInfo { padding: 11px 12px 13px; }

  .categoryName, .mediaName {
    font-weight: 650;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .categoryCount, .mediaType {
    margin-top: 4px;
    color: var(--muted);
    font-size: 13px;
  }

  .mediaThumb {
    aspect-ratio: 1;
    display: grid;
    place-items: center;
    background: #090a0c;
    overflow: hidden;
    position: relative;
  }

  .mediaThumb img, .mediaThumb video {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .videoBadge {
    position: absolute;
    right: 8px;
    bottom: 8px;
    padding: 4px 7px;
    border-radius: 7px;
    background: rgba(0,0,0,.75);
    font-size: 12px;
  }

  .mediaCard:hover, .categoryCard:hover { border-color: var(--accent); }

  .emptyState {
    border: 1px dashed var(--border);
    border-radius: 16px;
    padding: 30px 20px;
    text-align: center;
    color: var(--muted);
    line-height: 1.6;
  }

  #viewer {
    position: fixed;
    inset: 0;
    z-index: 30;
    background: #000;
    display: flex;
    flex-direction: column;
  }

  .viewerTop, .viewerBottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 14px;
    background: rgba(15,15,18,.94);
    z-index: 2;
  }

  .viewerTop { border-bottom: 1px solid #25252a; }
  .viewerBottom { border-top: 1px solid #25252a; }

  #viewerTitle {
    min-width: 0;
    flex: 1;
    text-align: center;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    color: #e8e8ec;
    font-size: 14px;
  }

  #viewerStage {
    flex: 1;
    min-height: 0;
    display: grid;
    place-items: center;
    position: relative;
    overflow: hidden;
    touch-action: pan-y;
    background: #000;
  }

  #viewerMedia {
    max-width: 100%;
    max-height: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
  }

  #viewerMedia.video {
    width: 100%;
    height: 100%;
  }

  .navArrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 46px;
    height: 58px;
    border-radius: 12px;
    background: rgba(35,35,40,.65);
    font-size: 25px;
    z-index: 1;
  }

  #prevButton { left: 12px; }
  #nextButton { right: 12px; }

  .viewerBottom button { padding: 10px 13px; }

  .viewerControls {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  #positionLabel {
    min-width: 75px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
  }

  #slideshowButton.active, #shuffleButton.active {
    background: var(--accent);
    color: white;
  }

  #toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    z-index: 100;
    background: #2b2d35;
    border: 1px solid #444753;
    border-radius: 12px;
    padding: 11px 16px;
    max-width: calc(100vw - 32px);
    text-align: center;
    box-shadow: 0 8px 30px #0008;
  }

  @media (max-width: 600px) {
    header { padding: 11px 12px; }
    main { padding: 14px 12px; }
    #categoryGrid, #mediaGrid {
      grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
      gap: 10px;
    }
    .viewerTop, .viewerBottom { padding: 9px; }
    .viewerBottom { flex-wrap: wrap; justify-content: center; }
    .viewerControls { justify-content: center; }
    .navArrow { width: 38px; height: 50px; }
  }
</style>
</head>
<body>

<section id="loadingScreen">
  <div class="loadingBox">
    <div class="logo">Media<span>Box</span></div>
    <p class="subtitle">Your media, neatly sorted by folder.</p>
    <p class="muted">Choose a folder to use its immediate subfolders as categories. Images and videos inside each category will appear together.</p>
    <div class="startActions">
      <button class="primary" id="chooseFolderButton">Choose media folder</button>
      <button id="chooseFilesButton">Choose files</button>
    </div>
    <input id="folderInput" type="file" accept="image/*,video/*" webkitdirectory directory multiple class="hidden">
    <input id="filesInput" type="file" accept="image/*,video/*" multiple class="hidden">
    <p class="muted" style="font-size:12px;margin-top:18px">
      Folder access is read-only. MediaBox does not upload or move your files.
    </p>
  </div>
</section>

<div id="app" class="hidden">
  <header>
    <div class="brand">Media<span>Box</span></div>
    <div class="headerActions">
      <button class="smallButton" id="homeButton">Categories</button>
      <button class="smallButton" id="addMediaButton">Add media</button>
      <button class="smallButton" id="changeFolderButton">Change folder</button>
    </div>
  </header>

  <main>
    <section id="categoriesView">
      <div class="sectionHeading">
        <div>
          <h1>Your categories</h1>
          <div class="muted" id="librarySummary"></div>
        </div>
      </div>
      <div id="categoryGrid"></div>
    </section>

    <section id="mediaView" class="hidden">
      <div class="sectionHeading">
        <div>
          <h1 id="categoryTitle">Category</h1>
          <div class="muted" id="categorySummary"></div>
        </div>
        <button id="backToCategoriesButton">All categories</button>
      </div>
      <div id="mediaGrid"></div>
    </section>
  </main>
</div>

<section id="viewer" class="hidden" aria-label="Media viewer">
  <div class="viewerTop">
    <button id="closeViewerButton" aria-label="Close viewer">✕</button>
    <div id="viewerTitle"></div>
    <button id="fullscreenButton" aria-label="Toggle fullscreen">⛶</button>
  </div>

  <div id="viewerStage">
    <button class="navArrow" id="prevButton" aria-label="Previous">‹</button>
    <div id="viewerMediaHost" style="display:contents"></div>
    <button class="navArrow" id="nextButton" aria-label="Next">›</button>
  </div>

  <div class="viewerBottom">
    <div class="viewerControls">
      <button id="viewerPrevButton">Previous</button>
      <span id="positionLabel">0 / 0</span>
      <button id="viewerNextButton">Next</button>
    </div>
    <div class="viewerControls">
      <button id="shuffleButton">Shuffle</button>
      <button id="slideshowButton">Slideshow</button>
      <button id="slideshowSpeedButton">5 sec</button>
    </div>
  </div>
</section>

<div id="toast" class="hidden"></div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);

  const loadingScreen = $("loadingScreen");
  const app = $("app");
  const folderInput = $("folderInput");
  const filesInput = $("filesInput");
  const categoriesView = $("categoriesView");
  const mediaView = $("mediaView");
  const categoryGrid = $("categoryGrid");
  const mediaGrid = $("mediaGrid");
  const viewer = $("viewer");
  const viewerStage = $("viewerStage");
  const viewerMediaHost = $("viewerMediaHost");

  let library = [];
  let categories = new Map();
  let currentCategory = "";
  let viewerItems = [];
  let viewerIndex = 0;
  let shuffleOn = false;
  let slideshowOn = false;
  let slideshowTimer = null;
  let slideshowSeconds = 5;
  let objectUrls = [];
  let toastTimer = null;
  let touchStartX = 0;
  let touchStartY = 0;

  function showToast(message) {
    const toast = $("toast");
    toast.textContent = message;
    toast.classList.remove("hidden");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.add("hidden"), 2600);
  }

  function isSupportedMedia(file) {
    return file.type.startsWith("image/") || file.type.startsWith("video/");
  }

  function getRelativePath(file) {
    return file.webkitRelativePath || file.name;
  }

  function categoryFromPath(file) {
    const path = getRelativePath(file).replaceAll("\\", "/");
    const parts = path.split("/").filter(Boolean);

    // The selected folder is the root. Its immediate subfolders are categories.
    // Files directly in the selected root are placed in "Uncategorised".
    return parts.length > 1 ? parts[0] : "Uncategorised";
  }

  function createItem(file, category) {
    return {
      file,
      name: file.name,
      type: file.type.startsWith("video/") ? "video" : "image",
      category,
      url: null
    };
  }

  function loadFiles(fileList, useFolderPaths) {
    const files = Array.from(fileList).filter(isSupportedMedia);

    if (!files.length) {
      showToast("No supported images or videos were selected.");
      return;
    }

    library = files.map(file => {
      const category = useFolderPaths ? categoryFromPath(file) : "All Media";
      return createItem(file, category);
    });

    currentCategory = "";
    buildCategories();
    loadingScreen.classList.add("hidden");
    app.classList.remove("hidden");
    showCategories();
    showToast(`${library.length} media files loaded`);
  }

  function buildCategories() {
    categories = new Map();

    for (const item of library) {
      if (!categories.has(item.category)) categories.set(item.category, []);
      categories.get(item.category).push(item);
    }

    $("librarySummary").textContent =
      `${library.length} files · ${categories.size} categories`;
  }

  function showCategories() {
    stopSlideshow();
    viewer.classList.add("hidden");
    categoriesView.classList.remove("hidden");
    mediaView.classList.add("hidden");
    renderCategories();
  }

  function renderCategories() {
    categoryGrid.replaceChildren();

    if (!categories.size) {
      categoryGrid.innerHTML = '<div class="emptyState">Choose a folder or select media files to get started.</div>';
      return;
    }

    const sorted = Array.from(categories.entries()).sort((a, b) =>
      a[0].localeCompare(b[0], undefined, { sensitivity: "base" })
    );

    for (const [name, items] of sorted) {
      const card = document.createElement("button");
      card.className = "categoryCard";

      const art = document.createElement("div");
      art.className = "categoryArt";
      art.textContent = items.some(item => item.type === "video") ? "▣" : "▧";

      const info = document.createElement("div");
      info.className = "categoryInfo";

      const title = document.createElement("div");
      title.className = "categoryName";
      title.textContent = name;

      const count = document.createElement("div");
      count.className = "categoryCount";
      count.textContent = `${items.length} ${items.length === 1 ? "item" : "items"}`;

      info.append(title, count);
      card.append(art, info);
      card.addEventListener("click", () => openCategory(name));
      categoryGrid.append(card);
    }
  }

  function openCategory(name) {
    currentCategory = name;
    const items = categories.get(name) || [];

    categoriesView.classList.add("hidden");
    mediaView.classList.remove("hidden");
    $("categoryTitle").textContent = name;
    $("categorySummary").textContent = `${items.length} items`;
    renderMedia(items);
  }

  function renderMedia(items) {
    mediaGrid.replaceChildren();

    if (!items.length) {
      mediaGrid.innerHTML = '<div class="emptyState">This category is empty.</div>';
      return;
    }

    items.forEach((item, index) => {
      const card = document.createElement("button");
      card.className = "mediaCard";

      const thumb = document.createElement("div");
      thumb.className = "mediaThumb";

      if (item.type === "image") {
        const img = document.createElement("img");
        img.alt = "";
        img.loading = "lazy";
        img.src = getObjectUrl(item);
        thumb.append(img);
      } else {
        const video = document.createElement("video");
        video.muted = true;
        video.preload = "metadata";
        video.src = getObjectUrl(item);
        video.playsInline = true;
        thumb.append(video);

        const badge = document.createElement("span");
        badge.className = "videoBadge";
        badge.textContent = "▶ Video";
        thumb.append(badge);
      }

      const info = document.createElement("div");
      info.className = "mediaInfo";

      const title = document.createElement("div");
      title.className = "mediaName";
      title.textContent = item.name;
      title.title = item.name;

      const type = document.createElement("div");
      type.className = "mediaType";
      type.textContent = item.type === "video" ? "Video" : "Image";

      info.append(title, type);
      card.append(thumb, info);
      card.addEventListener("click", () => {
        viewerItems = items.slice();
        viewerIndex = index;
        shuffleOn = false;
        $("shuffleButton").classList.remove("active");
        openViewer();
      });

      mediaGrid.append(card);
    });
  }

  function getObjectUrl(item) {
    if (!item.url) {
      item.url = URL.createObjectURL(item.file);
      objectUrls.push(item.url);
    }
    return item.url;
  }

  function openViewer() {
    if (!viewerItems.length) return;
    viewer.classList.remove("hidden");
    renderViewerItem();
  }

  function renderViewerItem() {
    const item = viewerItems[viewerIndex];
    if (!item) return;

    viewerMediaHost.replaceChildren();

    const media = document.createElement(item.type === "video" ? "video" : "img");
    media.id = "viewerMedia";
    media.src = getObjectUrl(item);

    if (item.type === "video") {
      media.className = "video";
      media.controls = true;
      media.autoplay = true;
      media.playsInline = true;
      media.addEventListener("loadedmetadata", () => {
        if (media.videoWidth > 0 && media.videoHeight > 0) {
          media.style.aspectRatio = `${media.videoWidth} / ${media.videoHeight}`;
        }
      });
    } else {
      media.alt = item.name;
      media.draggable = false;
    }

    viewerMediaHost.append(media);
    $("viewerTitle").textContent = item.name;
    $("positionLabel").textContent = `${viewerIndex + 1} / ${viewerItems.length}`;

    $("viewerPrevButton").disabled = viewerItems.length < 2;
    $("viewerNextButton").disabled = viewerItems.length < 2;
    $("prevButton").disabled = viewerItems.length < 2;
    $("nextButton").disabled = viewerItems.length < 2;
  }

  function nextItem() {
    if (viewerItems.length < 2) return;

    if (shuffleOn) {
      if (viewerItems.length === 2) {
        viewerIndex = (viewerIndex + 1) % viewerItems.length;
      } else {
        let next = viewerIndex;
        while (next === viewerIndex) {
          next = Math.floor(Math.random() * viewerItems.length);
        }
        viewerIndex = next;
      }
    } else {
      viewerIndex = (viewerIndex + 1) % viewerItems.length;
    }

    renderViewerItem();
  }

  function previousItem() {
    if (viewerItems.length < 2) return;
    viewerIndex = (viewerIndex - 1 + viewerItems.length) % viewerItems.length;
    renderViewerItem();
  }

  function startSlideshow() {
    if (viewerItems.length < 2) {
      showToast("This category needs at least two items for a slideshow.");
      return;
    }

    slideshowOn = true;
    $("slideshowButton").classList.add("active");
    $("slideshowButton").textContent = "Stop slideshow";
    slideshowTimer = setInterval(nextItem, slideshowSeconds * 1000);
  }

  function stopSlideshow() {
    slideshowOn = false;
    clearInterval(slideshowTimer);
    slideshowTimer = null;
    $("slideshowButton").classList.remove("active");
    $("slideshowButton").textContent = "Slideshow";
  }

  function toggleSlideshow() {
    if (slideshowOn) stopSlideshow();
    else startSlideshow();
  }

  function closeViewer() {
    stopSlideshow();
    viewer.classList.add("hidden");
    viewerMediaHost.replaceChildren();
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      viewer.requestFullscreen?.().catch(() => showToast("Fullscreen is not available here."));
    } else {
      document.exitFullscreen?.();
    }
  }

  function openPicker(input) {
    input.value = "";
    input.click();
  }

  $("chooseFolderButton").addEventListener("click", () => openPicker(folderInput));
  $("chooseFilesButton").addEventListener("click", () => openPicker(filesInput));
  $("addMediaButton").addEventListener("click", () => openPicker(filesInput));
  $("changeFolderButton").addEventListener("click", () => openPicker(folderInput));

  folderInput.addEventListener("change", event => {
    if (event.target.files.length) loadFiles(event.target.files, true);
  });

  filesInput.addEventListener("change", event => {
    if (event.target.files.length) loadFiles(event.target.files, false);
  });

  $("homeButton").addEventListener("click", showCategories);
  $("backToCategoriesButton").addEventListener("click", showCategories);

  $("closeViewerButton").addEventListener("click", closeViewer);
  $("fullscreenButton").addEventListener("click", toggleFullscreen);
  $("prevButton").addEventListener("click", previousItem);
  $("nextButton").addEventListener("click", nextItem);
  $("viewerPrevButton").addEventListener("click", previousItem);
  $("viewerNextButton").addEventListener("click", nextItem);
  $("slideshowButton").addEventListener("click", toggleSlideshow);

  $("shuffleButton").addEventListener("click", () => {
    shuffleOn = !shuffleOn;
    $("shuffleButton").classList.toggle("active", shuffleOn);
    showToast(shuffleOn ? "Shuffle enabled" : "Shuffle disabled");
  });

  $("slideshowSpeedButton").addEventListener("click", () => {
    const speeds = [3, 5, 8, 10, 15];
    const current = speeds.indexOf(slideshowSeconds);
    slideshowSeconds = speeds[(current + 1) % speeds.length];
    $("slideshowSpeedButton").textContent = `${slideshowSeconds} sec`;

    if (slideshowOn) {
      stopSlideshow();
      startSlideshow();
    }
  });

  viewerStage.addEventListener("touchstart", event => {
    if (event.touches.length !== 1) return;
    touchStartX = event.touches[0].clientX;
    touchStartY = event.touches[0].clientY;
  }, { passive: true });

  viewerStage.addEventListener("touchend", event => {
    if (event.changedTouches.length !== 1) return;

    const dx = event.changedTouches[0].clientX - touchStartX;
    const dy = event.changedTouches[0].clientY - touchStartY;

    if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.2) {
      dx < 0 ? nextItem() : previousItem();
    }
  }, { passive: true });

  document.addEventListener("keydown", event => {
    if (viewer.classList.contains("hidden")) return;

    if (event.key === "Escape") closeViewer();
    if (event.key === "ArrowRight") nextItem();
    if (event.key === "ArrowLeft") previousItem();
  });

  window.addEventListener("beforeunload", () => {
    objectUrls.forEach(url => URL.revokeObjectURL(url));
  });
})();
</script>
</body>
</html>
