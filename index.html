```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Share Pro</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen text-white flex items-center justify-center p-4 font-sans">

    <div id="app" class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
        <!-- Role Selection -->
        <div id="setup-section" class="text-center">
            <h1 class="text-2xl font-bold mb-2">Audio Share</h1>
            <p class="mb-8 text-slate-400">Simple PC to Phone streaming</p>
            <div class="space-y-4">
                <button onclick="initPC()" class="w-full bg-blue-600 hover:bg-blue-500 py-4 rounded-xl font-bold transition-all">
                    💻 This is my PC
                </button>
                <button onclick="initPhone()" class="w-full bg-slate-700 hover:bg-slate-600 py-4 rounded-xl font-bold transition-all">
                    📱 This is my Phone
                </button>
            </div>
        </div>

        <!-- PC View -->
        <div id="pc-view" class="hidden text-center">
            <h2 class="text-xl font-semibold mb-6">PC Transmitter</h2>
            <div class="bg-slate-900 p-6 rounded-xl mb-6 border border-slate-700">
                <p class="text-xs text-slate-500 mb-2 uppercase tracking-widest">Pairing Code</p>
                <div id="pc-id" class="text-4xl font-mono font-bold text-blue-400">------</div>
            </div>
            
            <div id="pc-controls" class="space-y-4">
                <button id="start-btn" class="w-full bg-green-600 py-3 rounded-lg font-bold hover:bg-green-500">
                    1. Capture System Audio
                </button>
                <p id="pc-status" class="text-sm text-slate-400 italic">Waiting for capture...</p>
            </div>
        </div>

        <!-- Phone View -->
        <div id="phone-view" class="hidden text-center">
            <h2 class="text-xl font-semibold mb-6">Phone Receiver</h2>
            <input type="text" id="join-id" placeholder="Enter 6-digit code" 
                   class="w-full p-4 rounded-xl bg-slate-900 text-white text-center text-2xl font-mono mb-4 border border-slate-700 focus:border-blue-500 outline-none">
            <button id="connect-btn" class="w-full bg-blue-600 py-4 rounded-xl font-bold hover:bg-blue-500">
                Connect & Listen
            </button>
            <p id="phone-status" class="mt-4 text-sm text-slate-400 italic">Ready to receive</p>
        </div>
    </div>

    <audio id="remote-audio" autoplay playsinline></audio>

    <script>
        let peer = null;
        let localStream = null;
        const appId = "audio-share-simple-v2";

        // UI Elements
        const setupSection = document.getElementById('setup-section');
        const pcView = document.getElementById('pc-view');
        const phoneView = document.getElementById('phone-view');
        const pcStatus = document.getElementById('pc-status');
        const phoneStatus = document.getElementById('phone-status');
        const pcIdDisplay = document.getElementById('pc-id');

        function initPC() {
            setupSection.classList.add('hidden');
            pcView.classList.remove('hidden');
            
            const shortId = Math.random().toString(36).substring(2, 8).toUpperCase();
            peer = new Peer(shortId);

            peer.on('open', (id) => {
                pcIdDisplay.innerText = id;
                pcStatus.innerText = "Step 1: Capture audio first.";
            });

            document.getElementById('start-btn').onclick = async () => {
                try {
                    // Optimized capture constraints
                    localStream = await navigator.mediaDevices.getDisplayMedia({
                        video: { width: 1, height: 1 }, 
                        audio: {
                            echoCancellation: false,
                            noiseSuppression: false,
                            autoGainControl: false,
                            suppressLocalAudioPlayback: false
                        },
                        systemAudio: "include"
                    });

                    pcStatus.innerText = "Audio captured. Now enter code on phone.";
                    document.getElementById('start-btn').innerText = "✅ Audio Captured";
                    document.getElementById('start-btn').classList.replace('bg-green-600', 'bg-slate-700');
                    document.getElementById('start-btn').disabled = true;

                } catch (err) {
                    pcStatus.innerText = "Capture failed: " + err.message;
                }
            };

            // Listen for the "Ping" from the phone
            peer.on('connection', (conn) => {
                conn.on('data', (data) => {
                    if (data === 'request-stream' && localStream) {
                        pcStatus.innerText = "Phone detected! Sending audio...";
                        // PC calls the phone back with the stream
                        peer.call(conn.peer, localStream);
                    }
                });
            });
        }

        function initPhone() {
            setupSection.classList.add('hidden');
            phoneView.classList.remove('hidden');

            peer = new Peer(); 

            document.getElementById('connect-btn').onclick = () => {
                const targetId = document.getElementById('join-id').value.toUpperCase().trim();
                if (!targetId) return;

                phoneStatus.innerText = "Connecting to PC...";
                
                // Open a data connection first to tell PC we are ready
                const conn = peer.connect(targetId);
                
                conn.on('open', () => {
                    conn.send('request-stream');
                    phoneStatus.innerText = "Requesting audio stream...";
                });

                // Listen for the incoming call from PC
                peer.on('call', (call) => {
                    phoneStatus.innerText = "Receiving stream...";
                    call.answer(); // Answer with nothing
                    
                    call.on('stream', (remoteStream) => {
                        const audioEl = document.getElementById('remote-audio');
                        audioEl.srcObject = remoteStream;
                        audioEl.play().then(() => {
                            phoneStatus.innerText = "🔊 Streaming Active";
                        }).catch(e => {
                            phoneStatus.innerText = "Tap 'Connect' again (Autoplay blocked)";
                        });
                    });
                });

                conn.on('error', () => {
                    phoneStatus.innerText = "Failed to reach PC. Check code.";
                });
            };
        }
    </script>
</body>
</html>

```
