<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MediaBox</title>

<style>
:root {
  color-scheme: dark;
  --bg: #101114;
  --panel: #1b1d22;
  --panel2: #292c35;
  --text: #f4f5f7;
  --muted: #a6a9b2;
  --accent: #8b7cff;
  --border: #343740;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

button {
  font: inherit;
  border: 0;
  color: var(--text);
  background: var(--panel2);
  border-radius: 12px;
  padding: 11px 15px;
  cursor: pointer;
}

button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
}

button:disabled {
  opacity: .4;
  cursor: default;
}

.hidden {
  display: none !important;
}

/* Loading screen */

#loadingScreen {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  padding: 24px;
  background: var(--bg);
  text-align: center;
}

.loadingBox {
  max-width: 460px;
}

.logo {
  font-size: clamp(42px, 10vw, 70px);
  font-weight: 800;
  letter-spacing: -3px;
  margin-bottom: 8px;
}

.logo span,
.brand span {
  color: var(--accent);
}

.subtitle,
.muted {
  color: var(--muted);
  line-height: 1.5;
}

.startActions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  justify-content: center;
  margin-top: 24px;
}

.primary {
  background: var(--accent);
  color: white;
  font-weight: 700;
}

/* Main app */

#app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  background: rgba(16,17,20,.94);
  position: sticky;
  top: 0;
  z-index: 5;
  backdrop-filter: blur(12px);
}

.brand {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -1px;
  white-space: nowrap;
}

.headerActions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.smallButton {
  padding: 9px 12px;
  font-size: 14px;
}

main {
  width: 100%;
  max-width: 1500px;
  margin: 0 auto;
  padding: 20px;
  flex: 1;
}

.sectionHeading {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  margin: 6px 0 16px;
}

h1 {
  font-size: clamp(24px, 5vw, 34px);
  margin: 0 0 6px;
}

#categoryGrid,
#mediaGrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
  gap: 14px;
}

/* Category cards */

.categoryCard,
.mediaCard {
  min-width: 0;
  overflow: hidden;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 15px;
  cursor: pointer;
  text-align: left;
  padding: 0;
}

.categoryArt {
  aspect-ratio: 1.35;
  display: grid;
  place-items: center;
  background:
    radial-gradient(circle at 20% 20%, rgba(139,124,255,.55), transparent 45%),
    linear-gradient(135deg, #292b36, #17181d);
  font-size: 48px;
}

.categoryInfo,
.mediaInfo {
  padding: 11px 12px 13px;
}

.categoryName,
.mediaName {
  font-weight: 650;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.categoryCount,
.mediaType {
  margin-top: 4px;
  color: var(--muted);
  font-size: 13px;
}

.categoryCard:hover,
.mediaCard:hover {
  border-color: var(--accent);
}

/* Media thumbnails */

.mediaThumb {
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  background: #090a0c;
  overflow: hidden;
  position: relative;
}

.mediaThumb img,
.mediaThumb video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.videoBadge {
  position: absolute;
  right: 8px;
  bottom: 8px;
  padding: 4px 7px;
  border-radius: 7px;
  background: rgba(0,0,0,.75);
  font-size: 12px;
}

.emptyState {
  border: 1px dashed var(--border);
  border-radius: 16px;
  padding: 30px 20px;
  text-align: center;
  color: var(--muted);
  line-height: 1.6;
}

/* Simple media viewer */

#viewer {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: #000;
  display: flex;
  flex-direction: column;
}

#viewerStage {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  background: #000;
  touch-action: pan-y;
}

#viewerMedia {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
}

#viewerMedia.video {
  width: 100%;
  height: 100%;
}

.viewerClose {
  position: absolute;
  top: max(14px, env(safe-area-inset-top));
  left: 14px;
  z-index: 3;
  width: 42px;
  height: 42px;
  padding: 0;
  border-radius: 50%;
  background: rgba(35,35,40,.75);
  font-size: 22px;
  display: grid;
  place-items: center;
}

.shuffleButton {
  position: absolute;
  z-index: 3;
  right: 16px;
  bottom: max(18px, env(safe-area-inset-bottom));
  min-width: 48px;
  height: 48px;
  padding: 0 15px;
  border-radius: 24px;
  background: rgba(35,35,40,.85);
  font-size: 21px;
  display: grid;
  place-items: center;
  box-shadow: 0 4px 20px #0008;
}

.shuffleButton.active {
  background: var(--accent);
  color: #fff;
}

#toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  z-index: 100;
  background: #2b2d35;
  border: 1px solid #444753;
  border-radius: 12px;
  padding: 11px 16px;
  max-width: calc(100vw - 32px);
  text-align: center;
  box-shadow: 0 8px 30px #0008;
}

@media (max-width: 600px) {
  header {
    padding: 11px 12px;
  }

  main {
    padding: 14px 12px;
  }

  #categoryGrid,
  #mediaGrid {
    grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
    gap: 10px;
  }
}
</style>
</head>

<body>

<!-- Loading screen -->

<section id="loadingScreen">
  <div class="loadingBox">
    <div class="logo">Media<span>Box</span></div>

    <p class="subtitle">
      Your media, neatly sorted by folder.
    </p>

    <p class="muted">
      Select your main folder. Its immediate subfolders will become your categories.
    </p>

    <div class="startActions">
      <button class="primary" id="chooseFolderButton">
        Choose main folder
      </button>

      <button id="chooseFilesButton">
        Choose files
      </button>
    </div>

    <input
      id="folderInput"
      type="file"
      accept="image/*,video/*"
      webkitdirectory
      directory
      multiple
      class="hidden"
    >

    <input
      id="filesInput"
      type="file"
      accept="image/*,video/*"
      multiple
      class="hidden"
    >

    <p class="muted" style="font-size:12px;margin-top:18px">
      Your files stay on your device. MediaBox does not upload or move them.
    </p>
  </div>
</section>

<!-- Main application -->

<div id="app" class="hidden">

  <header>
    <div class="brand">Media<span>Box</span></div>

    <div class="headerActions">
      <button class="smallButton" id="homeButton">Categories</button>
      <button class="smallButton" id="addMediaButton">Add media</button>
      <button class="smallButton" id="changeFolderButton">Change folder</button>
    </div>
  </header>

  <main>

    <section id="categoriesView">
      <div class="sectionHeading">
        <div>
          <h1>Your categories</h1>
          <div class="muted" id="librarySummary"></div>
        </div>
      </div>

      <div id="categoryGrid"></div>
    </section>

    <section id="mediaView" class="hidden">
      <div class="sectionHeading">
        <div>
          <h1 id="categoryTitle">Category</h1>
          <div class="muted" id="categorySummary"></div>
        </div>

        <button id="backToCategoriesButton">All categories</button>
      </div>

      <div id="mediaGrid"></div>
    </section>

  </main>
</div>

<!-- Simple viewer: swipe + shuffle -->

<section id="viewer" class="hidden" aria-label="Media viewer">

  <button
    class="viewerClose"
    id="closeViewerButton"
    aria-label="Close viewer"
  >×</button>

  <div id="viewerStage"></div>

  <button
    class="shuffleButton"
    id="shuffleButton"
    aria-label="Toggle shuffle"
    title="Shuffle"
  >⤨</button>

</section>

<div id="toast" class="hidden"></div>

<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);

  const loadingScreen = $("loadingScreen");
  const app = $("app");

  const folderInput = $("folderInput");
  const filesInput = $("filesInput");

  const categoriesView = $("categoriesView");
  const mediaView = $("mediaView");

  const categoryGrid = $("categoryGrid");
  const mediaGrid = $("mediaGrid");

  const viewer = $("viewer");
  const viewerStage = $("viewerStage");

  let library = [];
  let categories = new Map();

  let currentCategory = "";

  let viewerItems = [];
  let playbackOrder = [];
  let viewerPosition = 0;

  let shuffleOn = false;

  let objectUrls = [];
  let toastTimer = null;

  let touchStartX = 0;
  let touchStartY = 0;
  let pointerStartX = 0;
  let pointerStartY = 0;

  /* Notifications */

  function showToast(message) {
    const toast = $("toast");

    toast.textContent = message;
    toast.classList.remove("hidden");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
      toast.classList.add("hidden");
    }, 2600);
  }

  /* File handling */

  function isSupportedMedia(file) {
    return (
      file.type.startsWith("image/") ||
      file.type.startsWith("video/")
    );
  }

  function getRelativePath(file) {
    return (file.webkitRelativePath || file.name)
      .replaceAll("\\", "/");
  }

  /*
    IMPORTANT CATEGORY FIX

    Selecting a main folder produces paths similar to:

    MainFolder/PersonName/photo1.jpg
    MainFolder/PersonName/photo2.jpg
    MainFolder/AnotherPerson/video1.mp4

    The first path segment is the selected main folder.
    The SECOND path segment is the actual category.

    Files directly inside the main folder go into Uncategorised.
    Deeper nested folders remain inside their top-level category.
  */

  function categoryFromPath(file) {
    const parts = getRelativePath(file)
      .split("/")
      .filter(Boolean);

    if (parts.length >= 3) {
      return parts[1];
    }

    return "Uncategorised";
  }

  function createItem(file, category) {
    return {
      file,
      name: file.name,
      type: file.type.startsWith("video/") ? "video" : "image",
      category,
      url: null
    };
  }

  function revokeObjectUrls() {
    objectUrls.forEach(url => URL.revokeObjectURL(url));
    objectUrls = [];
  }

  function getObjectUrl(item) {
    if (!item.url) {
      item.url = URL.createObjectURL(item.file);
      objectUrls.push(item.url);
    }

    return item.url;
  }

  function loadFolderFiles(fileList) {
    const files = Array.from(fileList).filter(isSupportedMedia);

    if (!files.length) {
      showToast("No supported images or videos found.");
      return;
    }

    closeViewer();
    revokeObjectUrls();

    library = files.map(file => {
      return createItem(file, categoryFromPath(file));
    });

    currentCategory = "";

    buildCategories();

    loadingScreen.classList.add("hidden");
    app.classList.remove("hidden");

    showCategories();

    showToast(`${library.length} media files loaded`);
  }

  function addSelectedFiles(fileList) {
    const files = Array.from(fileList).filter(isSupportedMedia);

    if (!files.length) {
      showToast("No supported images or videos selected.");
      return;
    }

    const addedItems = files.map(file => {
      return createItem(file, "Uncategorised");
    });

    library.push(...addedItems);

    buildCategories();

    if (currentCategory && categories.has(currentCategory)) {
      openCategory(currentCategory);
    } else {
      showCategories();
    }

    showToast(`${addedItems.length} files added`);
  }

  /* Category handling */

  function buildCategories() {
    categories = new Map();

    for (const item of library) {
      if (!categories.has(item.category)) {
        categories.set(item.category, []);
      }

      categories.get(item.category).push(item);
    }

    $("librarySummary").textContent =
      `${library.length} files · ${categories.size} categories`;
  }

  function showCategories() {
    closeViewer();

    categoriesView.classList.remove("hidden");
    mediaView.classList.add("hidden");

    renderCategories();
  }

  function renderCategories() {
    categoryGrid.replaceChildren();

    if (!categories.size) {
      const empty = document.createElement("div");

      empty.className = "emptyState";
      empty.textContent = "Choose a folder or select media files to get started.";

      categoryGrid.append(empty);
      return;
    }

    const sortedCategories = Array.from(categories.entries()).sort(
      (a, b) => a[0].localeCompare(
        b[0],
        undefined,
        { sensitivity: "base" }
      )
    );

    for (const [name, items] of sortedCategories) {
      const card = document.createElement("button");
      card.className = "categoryCard";

      const art = document.createElement("div");
      art.className = "categoryArt";
      art.textContent = items.some(item => item.type === "video")
        ? "▣"
        : "▧";

      const info = document.createElement("div");
      info.className = "categoryInfo";

      const title = document.createElement("div");
      title.className = "categoryName";
      title.textContent = name;

      const count = document.createElement("div");
      count.className = "categoryCount";
      count.textContent =
        `${items.length} ${items.length === 1 ? "item" : "items"}`;

      info.append(title, count);
      card.append(art, info);

      card.addEventListener("click", () => {
        openCategory(name);
      });

      categoryGrid.append(card);
    }
  }

  function openCategory(name) {
    currentCategory = name;

    const items = categories.get(name) || [];

    categoriesView.classList.add("hidden");
    mediaView.classList.remove("hidden");

    $("categoryTitle").textContent = name;
    $("categorySummary").textContent = `${items.length} items`;

    renderMedia(items);
  }

  /* Media thumbnails */

  function renderMedia(items) {
    mediaGrid.replaceChildren();

    if (!items.length) {
      const empty = document.createElement("div");

      empty.className = "emptyState";
      empty.textContent = "This category is empty.";

      mediaGrid.append(empty);
      return;
    }

    items.forEach((item, index) => {
      const card = document.createElement("button");
      card.className = "mediaCard";

      const thumb = document.createElement("div");
      thumb.className = "mediaThumb";

      if (item.type === "image") {
        const img = document.createElement("img");

        img.alt = "";
        img.loading = "lazy";
        img.src = getObjectUrl(item);

        thumb.append(img);
      } else {
        const video = document.createElement("video");

        video.muted = true;
        video.preload = "metadata";
        video.src = getObjectUrl(item);
        video.playsInline = true;

        thumb.append(video);

        const badge = document.createElement("span");
        badge.className = "videoBadge";
        badge.textContent = "▶ Video";

        thumb.append(badge);
      }

      const info = document.createElement("div");
      info.className = "mediaInfo";

      const title = document.createElement("div");
      title.className = "mediaName";
      title.textContent = item.name;
      title.title = item.name;

      const type = document.createElement("div");
      type.className = "mediaType";
      type.textContent = item.type === "video" ? "Video" : "Image";

      info.append(title, type);
      card.append(thumb, info);

      card.addEventListener("click", () => {
        startViewer(items, index);
      });

      mediaGrid.append(card);
    });
  }

  /* Viewer */

  function startViewer(items, selectedIndex) {
    viewerItems = items.slice();

    viewerPosition = selectedIndex;

    shuffleOn = false;
    playbackOrder = viewerItems.map((_, index) => index);

    $("shuffleButton").classList.remove("active");

    viewer.classList.remove("hidden");

    renderViewerItem();
  }

  function currentViewerItem() {
    const originalIndex = playbackOrder[viewerPosition];

    return viewerItems[originalIndex];
  }

  function renderViewerItem() {
    const item = currentViewerItem();

    if (!item) return;

    viewerStage.replaceChildren();

    let media;

    if (item.type === "video") {
      media = document.createElement("video");

      media.className = "video";
      media.controls = true;
      media.autoplay = true;
      media.playsInline = true;
      media.preload = "auto";
    } else {
      media = document.createElement("img");

      media.alt = item.name;
      media.draggable = false;
    }

    media.id = "viewerMedia";
    media.src = getObjectUrl(item);

    viewerStage.append(media);
  }

  function goNext() {
    if (viewerItems.length < 2) return;

    viewerPosition =
      (viewerPosition + 1) % playbackOrder.length;

    renderViewerItem();
  }

  function goPrevious() {
    if (viewerItems.length < 2) return;

    viewerPosition =
      (viewerPosition - 1 + playbackOrder.length) %
      playbackOrder.length;

    renderViewerItem();
  }

  function toggleShuffle() {
    if (viewerItems.length < 2) {
      showToast("Add more media to use shuffle.");
      return;
    }

    const currentOriginalIndex = playbackOrder[viewerPosition];

    shuffleOn = !shuffleOn;

    if (shuffleOn) {
      const shuffled = viewerItems.map((_, index) => index);

      // Keep the currently displayed item at the beginning.
      const remaining = shuffled.filter(
        index => index !== currentOriginalIndex
      );

      // Fisher-Yates shuffle.
      for (let i = remaining.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

        [remaining[i], remaining[j]] =
          [remaining[j], remaining[i]];
      }

      playbackOrder = [currentOriginalIndex, ...remaining];
      viewerPosition = 0;

      $("shuffleButton").classList.add("active");

      showToast("Shuffle enabled");
    } else {
      playbackOrder = viewerItems.map((_, index) => index);

      viewerPosition = currentOriginalIndex;

      $("shuffleButton").classList.remove("active");

      showToast("Shuffle disabled");
    }
  }

  function closeViewer() {
    viewer.classList.add("hidden");
    viewerStage.replaceChildren();

    viewerItems = [];
    playbackOrder = [];
    viewerPosition = 0;

    shuffleOn = false;

    $("shuffleButton").classList.remove("active");
  }

  /* Swipe navigation */

  function handleSwipe(startX, startY, endX, endY) {
    const dx = endX - startX;
    const dy = endY - startY;

    // Ignore short movements and mostly vertical gestures.
    if (
      Math.abs(dx) < 55 ||
      Math.abs(dx) < Math.abs(dy) * 1.2
    ) {
      return;
    }

    if (dx < 0) {
      goNext();
    } else {
      goPrevious();
    }
  }

  viewerStage.addEventListener("touchstart", event => {
    if (event.touches.length !== 1) return;

    touchStartX = event.touches[0].clientX;
    touchStartY = event.touches[0].clientY;
  }, { passive: true });

  viewerStage.addEventListener("touchend", event => {
    if (event.changedTouches.length !== 1) return;

    const touch = event.changedTouches[0];

    handleSwipe(
      touchStartX,
      touchStartY,
      touch.clientX,
      touch.clientY
    );
  }, { passive: true });

  // Pointer support for mouse dragging on computers.
  viewerStage.addEventListener("pointerdown", event => {
    if (event.pointerType === "touch") return;

    pointerStartX = event.clientX;
    pointerStartY = event.clientY;
  });

  viewerStage.addEventListener("pointerup", event => {
    if (event.pointerType === "touch") return;

    handleSwipe(
      pointerStartX,
      pointerStartY,
      event.clientX,
      event.clientY
    );
  });

  /* Buttons */

  function openPicker(input) {
    input.value = "";
    input.click();
  }

  $("chooseFolderButton").addEventListener("click", () => {
    openPicker(folderInput);
  });

  $("chooseFilesButton").addEventListener("click", () => {
    openPicker(filesInput);
  });

  $("addMediaButton").addEventListener("click", () => {
    openPicker(filesInput);
  });

  $("changeFolderButton").addEventListener("click", () => {
    openPicker(folderInput);
  });

  folderInput.addEventListener("change", event => {
    if (event.target.files.length) {
      loadFolderFiles(event.target.files);
    }
  });

  filesInput.addEventListener("change", event => {
    if (event.target.files.length) {
      if (library.length === 0) {
        library = [];
        addSelectedFiles(event.target.files);

        loadingScreen.classList.add("hidden");
        app.classList.remove("hidden");

        showCategories();
      } else {
        addSelectedFiles(event.target.files);
      }
    }
  });

  $("homeButton").addEventListener("click", showCategories);

  $("backToCategoriesButton").addEventListener("click", showCategories);

  $("closeViewerButton").addEventListener("click", closeViewer);

  $("shuffleButton").addEventListener("click", toggleShuffle);

  /* Keyboard fallback */

  document.addEventListener("keydown", event => {
    if (viewer.classList.contains("hidden")) return;

    if (event.key === "Escape") {
      closeViewer();
    }

    if (event.key === "ArrowRight") {
      goNext();
    }

    if (event.key === "ArrowLeft") {
      goPrevious();
    }
  });

  /* Cleanup */

  window.addEventListener("beforeunload", () => {
    revokeObjectUrls();
  });

})();
</script>

</body>
</html>
