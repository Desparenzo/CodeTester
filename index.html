
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Super Mario TV Edition</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 background:#141414;color:white;font-family:monospace;
 min-height:100vh;display:flex;flex-direction:column;
 align-items:center;justify-content:center;overflow:hidden;
}
.hud{
 width:min(800px,100vw);display:flex;justify-content:space-around;
 padding:10px;font-weight:bold;background:#202020;font-size:15px;
}
canvas{
 width:min(800px,100vw);height:auto;max-height:75vh;
 border:3px solid white;background:#5c94fc;
 image-rendering:pixelated;
}
.help{color:#aaa;font-size:12px;padding:8px;text-align:center}
#overlay{
 position:fixed;inset:0;background:#000b;
 display:none;align-items:center;justify-content:center;z-index:10;
}
#panel{
 background:#18243a;border:3px solid white;
 padding:28px;width:min(380px,90vw);text-align:center;
 box-shadow:0 0 30px #000;
}
#panel h2{margin-bottom:20px;font-size:27px}
.menuBtn{
 display:block;width:100%;padding:15px;margin:10px 0;
 background:#263c60;color:white;border:2px solid #607da9;
 font:bold 17px monospace;
}
.menuBtn:focus,.menuBtn.active{
 outline:4px solid #ffdb35;outline-offset:3px;
 background:#b45b20;color:white;
}
#message{color:#ffd84a;margin-top:15px;font-size:13px}
</style>
</head>
<body>

<div class="hud">
 <div>SCORE: <span id="score">0</span></div>
 <div>COINS: <span id="coins">0</span></div>
 <div>STATUS: <span id="status">PLAYING</span></div>
</div>

<canvas id="game" width="800" height="450"></canvas>

<div class="help">
 D-PAD: MOVE | UP / OK: JUMP | PLAY: PAUSE | BACK: MENU
</div>

<div id="overlay">
 <div id="panel">
  <h2 id="menuTitle">PAUSED</h2>
  <button class="menuBtn" data-action="resume">RESUME</button>
  <button class="menuBtn" data-action="restart">RESTART LEVEL</button>
  <button class="menuBtn" data-action="quit">CLOSE MENU</button>
  <div id="message">Use D-pad and OK</div>
 </div>
</div>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');

const scoreEl=document.getElementById('score');
const coinsEl=document.getElementById('coins');
const statusEl=document.getElementById('status');
const overlay=document.getElementById('overlay');
const buttons=[...document.querySelectorAll('.menuBtn')];

let keys={};
let score=0,coinsCollected=0;
let gameOver=false,won=false,paused=false;
let cameraX=0;
let selected=0;
let jumpRequested=false;

const GRAVITY=.65;
const LEVEL_END=2600;

const player={
 x:60,y:300,w:28,h:34,
 vx:0,vy:0,speed:4.5,
 jumpForce:-13.5,onGround:false,facing:1
};

const platforms=[
 {x:0,y:390,w:950,h:60,type:'ground'},
 {x:1030,y:390,w:720,h:60,type:'ground'},
 {x:1840,y:390,w:900,h:60,type:'ground'},
 {x:260,y:290,w:90,h:24,type:'brick'},
 {x:350,y:290,w:30,h:24,type:'qblock',used:false},
 {x:380,y:290,w:90,h:24,type:'brick'},
 {x:640,y:330,w:40,h:60,type:'pipe'},
 {x:1180,y:310,w:120,h:24,type:'brick'},
 {x:1360,y:250,w:30,h:24,type:'qblock',used:false},
 {x:1520,y:330,w:40,h:60,type:'pipe'},
 {x:1980,y:300,w:140,h:24,type:'brick'},
 {x:2180,y:240,w:120,h:24,type:'brick'}
];

const coinStart=[
 [355,255],[520,355],[550,355],
 [1220,275],[1365,215],[2030,265],[2230,205]
];

let coins=coinStart.map(([x,y])=>({x,y,r:8,taken:false}));

const enemyStart=[
 [480,-1.5,420,620],
 [1120,-1.8,1040,1480],
 [1620,-1.6,1570,1740],
 [2050,-2,1860,2450]
];

let enemies=enemyStart.map(([x,vx,minX,maxX])=>({
 x,y:362,w:28,h:28,vx,minX,maxX,alive:true
}));

const flag={x:2520,y:170,w:12,h:220};

function updateHud(){
 scoreEl.textContent=score;
 coinsEl.textContent=coinsCollected;
 statusEl.textContent=won?'YOU WIN!':
 gameOver?'GAME OVER':paused?'PAUSED':'PLAYING';
}

function overlap(a,b){
 return a.x<b.x+b.w&&a.x+a.w>b.x&&
 a.y<b.y+b.h&&a.y+a.h>b.y;
}

function showMenu(title='PAUSED'){
 paused=true;
 updateHud();
 document.getElementById('menuTitle').textContent=title;
 overlay.style.display='flex';
 selected=0;
 focusButton();
}

function hideMenu(){
 overlay.style.display='none';
 paused=false;
 updateHud();
}

function focusButton(){
 buttons.forEach((b,i)=>{
  b.classList.toggle('active',i===selected);
 });
 buttons[selected].focus({preventScroll:true});
}

function restart(){
 player.x=60;player.y=300;
 player.vx=0;player.vy=0;
 player.onGround=false;player.facing=1;
 score=0;coinsCollected=0;
 gameOver=false;won=false;paused=false;
 cameraX=0;

 platforms.forEach(p=>{
  if(p.type==='qblock')p.used=false;
 });

 coins.forEach(c=>c.taken=false);

 enemies.forEach((e,i)=>{
  e.alive=true;
  e.x=enemyStart[i][0];
  e.vx=enemyStart[i][1];
 });

 hideMenu();
 updateHud();
}

function menuAction(action){
 if(action==='resume'){
  if(gameOver||won)return;
  hideMenu();
 }else if(action==='restart'){
  restart();
 }else if(action==='quit'){
  hideMenu();
 }
}

buttons.forEach((b,i)=>{
 b.addEventListener('click',()=>menuAction(b.dataset.action));
 b.addEventListener('focus',()=>selected=i);
});

function pauseToggle(){
 if(gameOver||won){
  showMenu(won?'COURSE CLEAR!':'GAME OVER');
  return;
 }
 if(paused)hideMenu();
 else showMenu();
}

function handleKeyDown(e){
 const code=e.code;
 const key=e.key;

 const relevant=[
 'ArrowLeft','ArrowRight','ArrowUp','ArrowDown',
 'Enter','Space','Escape','Backspace',
 'KeyW','KeyA','KeyS','KeyD','KeyR',
 'MediaPlayPause','MediaTrackNext','MediaTrackPrevious'
 ];

 if(relevant.includes(code)||relevant.includes(key)){
  e.preventDefault();
 }

 if(overlay.style.display==='flex'){
  if(code==='ArrowDown'){
   selected=(selected+1)%buttons.length;
   focusButton();
  }
  if(code==='ArrowUp'){
   selected=(selected-1+buttons.length)%buttons.length;
   focusButton();
  }
  if(code==='Enter'||code==='NumpadEnter'||code==='Space'){
   menuAction(buttons[selected].dataset.action);
  }
  if(code==='Escape'||code==='Backspace'){
   hideMenu();
  }
  return;
 }

 if(code==='Escape'||code==='Backspace'){
  pauseToggle();
  return;
 }

 if(code==='MediaPlayPause'||code==='KeyP'){
  pauseToggle();
  return;
 }

 if(code==='MediaTrackNext'||code==='MediaTrackPrevious'||code==='KeyR'){
  restart();
  return;
 }

 if(code==='Enter'||code==='NumpadEnter'){
  jumpRequested=true;
  return;
 }

 if(code==='ArrowUp'||code==='Space'||code==='KeyW'){
  jumpRequested=true;
  keys.jump=true;
  return;
 }

 if(code==='ArrowLeft'||code==='KeyA'){
  keys.left=true;
 }
 if(code==='ArrowRight'||code==='KeyD'){
  keys.right=true;
 }
}

function handleKeyUp(e){
 const code=e.code;
 if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',
 'Space','KeyW','KeyA','KeyD'].includes(code)){
  e.preventDefault();
 }
 if(code==='ArrowLeft'||code==='KeyA')keys.left=false;
 if(code==='ArrowRight'||code==='KeyD')keys.right=false;
 if(code==='ArrowUp'||code==='Space'||code==='KeyW'){
  keys.jump=false;
 }
}

window.addEventListener('keydown',handleKeyDown,{passive:false});
window.addEventListener('keyup',handleKeyUp,{passive:false});

window.addEventListener('blur',()=>{
 keys={};
 jumpRequested=false;
});

function update(){
 if(paused||gameOver||won)return;

 if(keys.left){
  player.vx=-player.speed;
  player.facing=-1;
 }else if(keys.right){
  player.vx=player.speed;
  player.facing=1;
 }else{
  player.vx*=.8;
  if(Math.abs(player.vx)<.2)player.vx=0;
 }

 if((jumpRequested||keys.jump)&&player.onGround){
  player.vy=player.jumpForce;
  player.onGround=false;
 }
 jumpRequested=false;

 player.vy+=GRAVITY;
 player.x+=player.vx;
 if(player.x<0)player.x=0;

 for(const p of platforms){
  if(overlap(player,p)){
   if(player.vx>0)player.x=p.x-player.w;
   else if(player.vx<0)player.x=p.x+p.w;
  }
 }

 player.y+=player.vy;
 player.onGround=false;

 for(const p of platforms){
  if(overlap(player,p)){
   if(player.vy>0){
    player.y=p.y-player.h;
    player.vy=0;
    player.onGround=true;
   }else if(player.vy<0){
    player.y=p.y+p.h;
    player.vy=0;
    if(p.type==='qblock'&&!p.used){
     p.used=true;
     coinsCollected++;
     score+=100;
     updateHud();
    }
   }
  }
 }

 for(const c of coins){
  if(!c.taken){
   const box={x:c.x-c.r,y:c.y-c.r,w:c.r*2,h:c.r*2};
   if(overlap(player,box)){
    c.taken=true;
    coinsCollected++;
    score+=100;
    updateHud();
   }
  }
 }

 for(const en of enemies){
  if(!en.alive)continue;

  en.x+=en.vx;
  if(en.x<=en.minX||en.x+en.w>=en.maxX)en.vx*=-1;

  if(overlap(player,en)){
   const stomping=player.vy>0&&
   player.y+player.h-player.vy<=en.y+10;

   if(stomping){
    en.alive=false;
    player.vy=-8;
    score+=200;
    updateHud();
   }else{
    gameOver=true;
    updateHud();
    showMenu('GAME OVER');
   }
  }
 }

 if(player.y>canvas.height){
  gameOver=true;
  updateHud();
  showMenu('GAME OVER');
 }

 if(player.x+player.w>=flag.x){
  won=true;
  score+=500;
  updateHud();
  showMenu('COURSE CLEAR!');
 }

 cameraX=Math.max(0,Math.min(
  player.x-240,LEVEL_END-canvas.width
 ));
}

function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 ctx.save();
 ctx.translate(-cameraX,0);

 // Clouds
 ctx.fillStyle='rgba(255,255,255,.85)';
 [180,620,1150,1700,2250].forEach(cx=>{
  ctx.beginPath();
  ctx.arc(cx,90,22,0,Math.PI*2);
  ctx.arc(cx+22,85,26,0,Math.PI*2);
  ctx.arc(cx+46,92,20,0,Math.PI*2);
  ctx.fill();
 });

 // Platforms
 for(const p of platforms){
  if(p.type==='ground'){
   ctx.fillStyle='#c84c0c';
   ctx.fillRect(p.x,p.y,p.w,p.h);
   ctx.fillStyle='#38b728';
   ctx.fillRect(p.x,p.y,p.w,12);
  }else if(p.type==='brick'){
   ctx.fillStyle='#b85a2a';
   ctx.fillRect(p.x,p.y,p.w,p.h);
   ctx.strokeStyle='#5c280e';
   ctx.strokeRect(p.x+.5,p.y+.5,p.w-1,p.h-1);
  }else if(p.type==='qblock'){
   ctx.fillStyle=p.used?'#8c6d46':'#f7b500';
   ctx.fillRect(p.x,p.y,p.w,p.h);
   ctx.strokeStyle='#5c3d00';
   ctx.strokeRect(p.x+.5,p.y+.5,p.w-1,p.h-1);
   if(!p.used){
    ctx.fillStyle='white';
    ctx.font='bold 16px monospace';
    ctx.fillText('?',p.x+9,p.y+18);
   }
  }else if(p.type==='pipe'){
   ctx.fillStyle='#2eb82e';
   ctx.fillRect(p.x+3,p.y+14,p.w-6,p.h-14);
   ctx.fillStyle='#38d638';
   ctx.fillRect(p.x,p.y,p.w,16);
   ctx.strokeStyle='#145214';
   ctx.strokeRect(p.x,p.y,p.w,16);
  }
 }

 // Coins
 for(const c of coins){
  if(c.taken)continue;
  ctx.fillStyle='#ffd700';
  ctx.beginPath();
  ctx.ellipse(c.x,c.y,c.r*.75,c.r,0,0,Math.PI*2);
  ctx.fill();
 }

 // Flag
 ctx.fillStyle='#ddd';
 ctx.fillRect(flag.x,flag.y,5,flag.h);
 ctx.fillStyle='#e52521';
 ctx.beginPath();
 ctx.moveTo(flag.x+5,flag.y);
 ctx.lineTo(flag.x+42,flag.y+18);
 ctx.lineTo(flag.x+5,flag.y+36);
 ctx.closePath();
 ctx.fill();

 // Enemies
 for(const en of enemies){
  if(!en.alive)continue;
  ctx.fillStyle='#8b4513';
  ctx.fillRect(en.x,en.y,en.w,en.h);
  ctx.fillStyle='white';
  ctx.fillRect(en.x+5,en.y+6,5,5);
  ctx.fillRect(en.x+18,en.y+6,5,5);
 }

 // Mario
 ctx.fillStyle='#e52521';
 ctx.fillRect(player.x+4,player.y,player.w-8,8);
 ctx.fillStyle='#ffcc99';
 ctx.fillRect(player.x+5,player.y+8,player.w-10,9);
 ctx.fillStyle='#2458e8';
 ctx.fillRect(player.x+4,player.y+17,player.w-8,17);
 ctx.fillStyle='#111';
 let eyeX=player.facing===1?player.x+17:player.x+7;
 ctx.fillRect(eyeX,player.y+10,3,3);

 ctx.restore();

 if(paused){
  ctx.fillStyle='#0008';
  ctx.fillRect(0,0,800,450);
  ctx.fillStyle='white';
  ctx.font='bold 30px monospace';
  ctx.textAlign='center';
  ctx.fillText('PAUSED',400,220);
  ctx.textAlign='left';
 }
}

function loop(){
 update();
 draw();
 requestAnimationFrame(loop);
}

updateHud();
loop();

// Keep TV remote focus available
document.addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
</html>
