<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Single-File Super Mario</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #141414;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: monospace, sans-serif;
    color: #fff;
  }
  canvas {
    border: 3px solid #fff;
    background: #5c94fc;
    image-rendering: pixelated;
    max-width: 100vw;
  }
  .hud {
    width: 800px;
    max-width: 100vw;
    display: flex;
    justify-content: space-between;
    padding: 8px 4px;
    font-size: 16px;
    font-weight: bold;
  }
  .help { font-size: 13px; color: #bbb; margin-top: 6px; }
</style>
</head>
<body>
  <div class="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>COINS: <span id="coins">0</span></div>
    <div>STATUS: <span id="status">PLAYING</span></div>
  </div>
  <canvas id="game" width="800" height="450"></canvas>
  <div class="help">Move: Arrow Keys / A, D &nbsp;|&nbsp; Jump / Stomp: Space / W / Up &nbsp;|&nbsp; Restart: R</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const coinsEl = document.getElementById('coins');
const statusEl = document.getElementById('status');

const GRAVITY = 0.65;
const LEVEL_END = 2600;

let keys = {};
let score = 0;
let coinsCollected = 0;
let gameOver = false;
let won = false;
let cameraX = 0;

const player = {
  x: 60, y: 300, w: 28, h: 34,
  vx: 0, vy: 0,
  speed: 4.5, jumpForce: -13.5,
  onGround: false, facing: 1
};

const platforms = [
  { x: 0, y: 390, w: 950, h: 60, type: 'ground' },
  { x: 1030, y: 390, w: 720, h: 60, type: 'ground' },
  { x: 1840, y: 390, w: 900, h: 60, type: 'ground' },
  { x: 260, y: 290, w: 90, h: 24, type: 'brick' },
  { x: 350, y: 290, w: 30, h: 24, type: 'qblock', used: false },
  { x: 380, y: 290, w: 90, h: 24, type: 'brick' },
  { x: 640, y: 330, w: 40, h: 60, type: 'pipe' },
  { x: 1180, y: 310, w: 120, h: 24, type: 'brick' },
  { x: 1360, y: 250, w: 30, h: 24, type: 'qblock', used: false },
  { x: 1520, y: 330, w: 40, h: 60, type: 'pipe' },
  { x: 1980, y: 300, w: 140, h: 24, type: 'brick' },
  { x: 2180, y: 240, w: 120, h: 24, type: 'brick' }
];

let coins = [
  { x: 355, y: 255, r: 8, taken: false },
  { x: 520, y: 355, r: 8, taken: false },
  { x: 550, y: 355, r: 8, taken: false },
  { x: 1220, y: 275, r: 8, taken: false },
  { x: 1365, y: 215, r: 8, taken: false },
  { x: 2030, y: 265, r: 8, taken: false },
  { x: 2230, y: 205, r: 8, taken: false }
];

let enemies = [
  { x: 480, y: 362, w: 28, h: 28, vx: -1.5, minX: 420, maxX: 620, alive: true },
  { x: 1120, y: 362, w: 28, h: 28, vx: -1.8, minX: 1040, maxX: 1480, alive: true },
  { x: 1620, y: 362, w: 28, h: 28, vx: -1.6, minX: 1570, maxX: 1740, alive: true },
  { x: 2050, y: 362, w: 28, h: 28, vx: -2.0, minX: 1860, maxX: 2450, alive: true }
];

const flag = { x: 2520, y: 170, w: 12, h: 220 };

window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyR') resetGame();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function resetGame() {
  player.x = 60; player.y = 300; player.vx = 0; player.vy = 0;
  player.onGround = false; player.facing = 1;
  score = 0; coinsCollected = 0; gameOver = false; won = false; cameraX = 0;
  platforms.forEach(p => { if (p.type === 'qblock') p.used = false; });
  coins.forEach(c => c.taken = false);
  enemies.forEach((en, i) => {
    en.alive = true;
    en.x = [480, 1120, 1620, 2050][i];
  });
  updateHud();
}

function updateHud() {
  scoreEl.textContent = score;
  coinsEl.textContent = coinsCollected;
  statusEl.textContent = won ? 'YOU WIN!' : (gameOver ? 'GAME OVER' : 'PLAYING');
}

function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function update() {
  if (gameOver || won) return;

  const left = keys['ArrowLeft'] || keys['KeyA'];
  const right = keys['ArrowRight'] || keys['KeyD'];
  const jump = keys['Space'] || keys['ArrowUp'] || keys['KeyW'];

  if (left) { player.vx = -player.speed; player.facing = -1; }
  else if (right) { player.vx = player.speed; player.facing = 1; }
  else { player.vx *= 0.8; if (Math.abs(player.vx) < 0.2) player.vx = 0; }

  if (jump && player.onGround) {
    player.vy = player.jumpForce;
    player.onGround = false;
  }

  player.vy += GRAVITY;
  player.x += player.vx;
  if (player.x < 0) player.x = 0;

  for (const p of platforms) {
    if (rectsOverlap(player, p)) {
      if (player.vx > 0) player.x = p.x - player.w;
      else if (player.vx < 0) player.x = p.x + p.w;
    }
  }

  player.y += player.vy;
  player.onGround = false;

  for (const p of platforms) {
    if (rectsOverlap(player, p)) {
      if (player.vy > 0) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      } else if (player.vy < 0) {
        player.y = p.y + p.h;
        player.vy = 0;
        if (p.type === 'qblock' && !p.used) {
          p.used = true;
          coinsCollected++;
          score += 100;
          updateHud();
        }
      }
    }
  }

  for (const c of coins) {
    if (!c.taken) {
      const box = { x: c.x - c.r, y: c.y - c.r, w: c.r * 2, h: c.r * 2 };
      if (rectsOverlap(player, box)) {
        c.taken = true;
        coinsCollected++;
        score += 100;
        updateHud();
      }
    }
  }

  for (const en of enemies) {
    if (!en.alive) continue;
    en.x += en.vx;
    if (en.x <= en.minX || en.x + en.w >= en.maxX) en.vx *= -1;

    if (rectsOverlap(player, en)) {
      const stomping = player.vy > 0 && player.y + player.h - player.vy <= en.y + 10;
      if (stomping) {
        en.alive = false;
        player.vy = -8;
        score += 200;
        updateHud();
      } else {
        gameOver = true;
        updateHud();
      }
    }
  }

  if (player.y > canvas.height) {
    gameOver = true;
    updateHud();
  }

  if (player.x + player.w >= flag.x) {
    won = true;
    score += 500;
    updateHud();
  }

  cameraX = Math.max(0, Math.min(player.x - 240, LEVEL_END - canvas.width));
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(-cameraX, 0);

  // Clouds
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  [180, 620, 1150, 1700, 2250].forEach(cx => {
    ctx.beginPath();
    ctx.arc(cx, 90, 22, 0, Math.PI * 2);
    ctx.arc(cx + 22, 85, 26, 0, Math.PI * 2);
    ctx.arc(cx + 46, 92, 20, 0, Math.PI * 2);
    ctx.fill();
  });

  // Platforms
  for (const p of platforms) {
    if (p.type === 'ground') {
      ctx.fillStyle = '#c84c0c';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#38b728';
      ctx.fillRect(p.x, p.y, p.w, 12);
    } else if (p.type === 'brick') {
      ctx.fillStyle = '#b85a2a';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.strokeStyle = '#5c280e';
      ctx.strokeRect(p.x + 0.5, p.y + 0.5, p.w - 1, p.h - 1);
    } else if (p.type === 'qblock') {
      ctx.fillStyle = p.used ? '#8c6d46' : '#f7b500';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.strokeStyle = '#5c3d00';
      ctx.strokeRect(p.x + 0.5, p.y + 0.5, p.w - 1, p.h - 1);
      if (!p.used) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 16px monospace';
        ctx.fillText('?', p.x + 9, p.y + 18);
      }
    } else if (p.type === 'pipe') {
      ctx.fillStyle = '#2eb82e';
      ctx.fillRect(p.x + 3, p.y + 14, p.w - 6, p.h - 14);
      ctx.fillStyle = '#38d638';
      ctx.fillRect(p.x, p.y, p.w, 16);
      ctx.strokeStyle = '#145214';
      ctx.strokeRect(p.x, p.y, p.w, 16);
    }
  }

  // Coins
  for (const c of coins) {
    if (c.taken) continue;
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.r * 0.75, c.r, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Flagpole
  ctx.fillStyle = '#ddd';
  ctx.fillRect(flag.x, flag.y, 5, flag.h);
  ctx.fillStyle = '#e52521';
  ctx.beginPath();
  ctx.moveTo(flag.x + 5, flag.y);
  ctx.lineTo(flag.x + 42, flag.y + 18);
  ctx.lineTo(flag.x + 5, flag.y + 36);
  ctx.closePath();
  ctx.fill();

  // Enemies
  for (const en of enemies) {
    if (!en.alive) continue;
    ctx.fillStyle = '#8b4513';
    ctx.fillRect(en.x, en.y, en.w, en.h);
    ctx.fillStyle = '#fff';
    ctx.fillRect(en.x + 5, en.y + 6, 5, 5);
    ctx.fillRect(en.x + 18, en.y + 6, 5, 5);
  }

  // Player (Mario)
  ctx.fillStyle = '#e52521'; // Hat & shirt
  ctx.fillRect(player.x + 4, player.y, player.w - 8, 8);
  ctx.fillStyle = '#ffcc99'; // Face
  ctx.fillRect(player.x + 5, player.y + 8, player.w - 10, 9);
  ctx.fillStyle = '#2458e8'; // Overalls
  ctx.fillRect(player.x + 4, player.y + 17, player.w - 8, 17);
  ctx.fillStyle = '#111'; // Eye
  const eyeX = player.facing === 1 ? player.x + 17 : player.x + 7;
  ctx.fillRect(eyeX, player.y + 10, 3, 3);

  ctx.restore();

  if (gameOver || won) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 36px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(won ? 'COURSE CLEAR!' : 'GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
    ctx.font = '18px monospace';
    ctx.fillText('Press R to play again', canvas.width / 2, canvas.height / 2 + 28);
    ctx.textAlign = 'left';
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
