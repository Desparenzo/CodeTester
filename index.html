
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#10121b">
<title>Desparenzo TV</title>

<style>
:root {
    --bg:#10121b;
    --surface:#1b1e2c;
    --surface2:#24283a;
    --text:#f4f5fb;
    --muted:#969db2;
    --accent:#a69aff;
    --line:#ffffff15;
    --focus:#a69aff;
}

[data-theme="light"] {
    --bg:#f2f3fa;
    --surface:#ffffff;
    --surface2:#e9eafa;
    --text:#171927;
    --muted:#74788b;
    --accent:#6457ed;
    --line:#25294718;
    --focus:#6457ed;
}

* {
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body {
    width:100vw;
    min-height:100vh;
    overflow-x:hidden;
    background:
        radial-gradient(ellipse at 0% 0%,#6457ed20,transparent 45%),
        radial-gradient(ellipse at 100% 20%,#259ec515,transparent 40%),
        var(--bg);
    color:var(--text);
    font-family:Arial,sans-serif;
    transition:background .2s,color .2s;
}

button,input {
    font:inherit;
    color:inherit;
}

button {
    cursor:pointer;
}

#app {
    width:100%;
    min-height:100vh;
    padding:25px 4.5vw 30px;
}

/* HEADER */

header {
    height:65px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:24px;
}

.brand {
    display:flex;
    align-items:center;
    gap:13px;
}

.brand-mark {
    width:48px;
    height:48px;
    border-radius:16px;
    display:grid;
    place-items:center;
    background:linear-gradient(140deg,#7867ff,#4b9fe8);
    color:white;
    font-size:21px;
    font-weight:900;
    box-shadow:0 7px 22px #6457ed45;
}

.brand-name {
    font-size:23px;
    font-weight:900;
    letter-spacing:-.5px;
}

.brand-sub {
    margin-top:4px;
    font-size:10px;
    font-weight:800;
    letter-spacing:2px;
    color:var(--muted);
}

.header-right {
    display:flex;
    align-items:center;
    gap:16px;
}

#clock {
    color:var(--muted);
    font-size:15px;
    font-weight:bold;
}

.header-btn {
    height:43px;
    min-width:43px;
    padding:0 13px;
    border:1px solid var(--line);
    border-radius:13px;
    background:var(--surface);
    font-size:17px;
}

/* INTRO */

.intro {
    display:flex;
    align-items:end;
    justify-content:space-between;
    margin:25px 0 25px;
}

.eyebrow {
    color:var(--accent);
    font-size:11px;
    font-weight:900;
    letter-spacing:2px;
    margin-bottom:8px;
}

.intro h1 {
    font-size:clamp(30px,4vw,43px);
    letter-spacing:-1.5px;
}

.intro p {
    margin-top:8px;
    color:var(--muted);
    font-size:14px;
}

#count {
    color:var(--muted);
    font-size:13px;
    padding-bottom:5px;
}

/* SEARCH */

.search-area {
    display:none;
    margin-bottom:20px;
}

.search-area.open {
    display:block;
}

#search {
    width:100%;
    height:48px;
    padding:0 18px;
    background:var(--surface);
    border:2px solid var(--line);
    border-radius:13px;
    outline:none;
    font-size:16px;
}

#search:focus {
    border-color:var(--focus);
}

/* CATEGORY NAV */

.category-nav {
    display:flex;
    gap:10px;
    overflow-x:auto;
    scrollbar-width:none;
    padding:5px 4px 14px;
    margin-bottom:12px;
}

.category-nav::-webkit-scrollbar {
    display:none;
}

.category-btn {
    flex-shrink:0;
    padding:11px 20px;
    border:1px solid var(--line);
    border-radius:30px;
    background:var(--surface);
    color:var(--muted);
    font-size:13px;
    font-weight:800;
}

.category-btn.active {
    background:var(--accent);
    color:white;
    border-color:transparent;
}

/* SECTIONS */

.library-section {
    margin-bottom:35px;
    scroll-margin-top:20px;
}

.section-heading {
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:17px;
}

.section-heading h2 {
    font-size:21px;
    font-weight:850;
}

.section-count {
    padding:4px 9px;
    border-radius:8px;
    background:var(--surface);
    color:var(--muted);
    font-size:11px;
    font-weight:bold;
}

.section-line {
    height:1px;
    background:var(--line);
    flex:1;
}

/* APPLICATION GRID */

.app-grid {
    display:grid;
    grid-template-columns:repeat(6,minmax(0,1fr));
    gap:15px;
}

.app-wrap {
    position:relative;
    min-width:0;
}

.app-card {
    width:100%;
    min-height:145px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:12px;
    padding:13px 8px;
    border:3px solid transparent;
    border-radius:19px;
    background:var(--surface);
    text-decoration:none;
    outline:none;
    transition:transform .15s,background .15s,border-color .15s;
}

.app-icon {
    width:72px;
    height:72px;
    border-radius:21px;
    display:grid;
    place-items:center;
    overflow:hidden;
    background:linear-gradient(140deg,var(--color1),var(--color2));
    box-shadow:0 7px 18px #0002;
    color:white;
    font-size:27px;
    font-weight:900;
}

.app-icon img {
    width:100%;
    height:100%;
    object-fit:cover;
}

.app-name {
    width:100%;
    color:var(--text);
    font-size:13px;
    line-height:1.3;
    font-weight:750;
    text-align:center;
    overflow-wrap:anywhere;
}

.app-card.focused {
    border-color:var(--focus);
    background:var(--surface2);
    transform:scale(1.09);
    box-shadow:0 12px 30px #0004;
    z-index:3;
}

.pin {
    position:absolute;
    top:5px;
    right:5px;
    width:29px;
    height:29px;
    border:1px solid var(--line);
    border-radius:50%;
    background:var(--surface2);
    font-size:17px;
    z-index:4;
}

.pin.active {
    color:#ffc95c;
}

/* EMPTY / LOADING */

.status {
    text-align:center;
    padding:45px 15px;
    border-radius:18px;
    background:var(--surface);
    color:var(--muted);
    line-height:1.7;
}

.status strong {
    display:block;
    color:var(--text);
    font-size:18px;
    margin-bottom:8px;
}

.hidden {
    display:none!important;
}

/* FOOTER */

footer {
    border-top:1px solid var(--line);
    margin-top:35px;
    padding-top:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:var(--muted);
    font-size:11px;
}

footer strong {
    color:var(--accent);
}

.key-hints {
    display:flex;
    gap:18px;
}

.key-hints b {
    background:var(--surface2);
    padding:6px 9px;
    border-radius:6px;
    color:var(--text);
    margin-right:5px;
}

/* REMOTE FOCUS */

button.focused {
    outline:3px solid var(--focus);
    outline-offset:3px;
    background:var(--surface2);
    color:var(--text);
    transform:scale(1.06);
}

.category-btn.active.focused {
    background:var(--accent);
    color:white;
}

/* TV SCREEN ADJUSTMENTS */

@media (min-width:1500px) {
    #app {
        padding:30px 5vw;
    }

    .app-grid {
        gap:20px;
    }

    .app-card {
        min-height:165px;
    }

    .app-icon {
        width:85px;
        height:85px;
    }

    .app-name {
        font-size:14px;
    }
}

@media (max-width:900px) {
    .app-grid {
        grid-template-columns:repeat(4,minmax(0,1fr));
    }
}

</style>
</head>

<body>

<div id="app">

<header>

    <div class="brand">
        <div class="brand-mark">D</div>
        <div>
            <div class="brand-name">Desparenzo Inc.</div>
            <div class="brand-sub">TV EDITION</div>
        </div>
    </div>

    <div class="header-right">
        <div id="clock">00:00</div>
        <button class="header-btn" id="searchBtn" aria-label="Search">⌕</button>
        <button class="header-btn" id="themeBtn" aria-label="Toggle theme">☾</button>
    </div>

</header>

<div class="intro">
    <div>
        <div class="eyebrow">YOUR COLLECTION</div>
        <h1>Games & Apps</h1>
        <p>Everything I made, in one place.</p>
    </div>
    <div id="count">Loading...</div>
</div>

<div class="search-area" id="searchArea">
    <input id="search" type="text"
        placeholder="Search applications and games...">
</div>

<nav class="category-nav" id="categoryNav">
    <button class="category-btn active" data-category="all">All</button>
</nav>

<section class="library-section hidden" id="pinnedSection">
    <div class="section-heading">
        <h2>★ Pinned</h2>
        <span class="section-count" id="pinnedCount">0</span>
        <div class="section-line"></div>
    </div>
    <div class="app-grid" id="pinnedGrid"></div>
</section>

<div id="library">
    <div class="status">
        <strong>Loading Desparenzo...</strong>
        Connecting to your application library.
    </div>
</div>

<div class="status hidden" id="empty">
    <strong>No applications found</strong>
    Try a different search.
</div>

<footer>
    <span>BUILT WITH CARE BY <strong>DESPARENZO</strong></span>

    <div class="key-hints">
        <span><b>↕ ↔</b> Navigate</span>
        <span><b>OK</b> Select</span>
        <span><b>BACK</b> Return</span>
    </div>
</footer>

</div>

<script>
(() => {

'use strict';

/* SHARED GITHUB DATA */

const DATA_URL =
'https://raw.githubusercontent.com/Desparenzo/Desparenzo/main/library.txt';

const ICON_BASE =
'https://raw.githubusercontent.com/Desparenzo/Desparenzo/main/icons/';

const PIN_KEY = 'desparenzo-tv-pins';
const THEME_KEY = 'desparenzo-tv-theme';

const library = document.getElementById('library');
const categoryNav = document.getElementById('categoryNav');
const search = document.getElementById('search');
const searchArea = document.getElementById('searchArea');
const pinnedGrid = document.getElementById('pinnedGrid');
const pinnedSection = document.getElementById('pinnedSection');
const empty = document.getElementById('empty');

let categories = [];
let allItems = [];
let pins = new Set();

let currentCategory = 'all';
let query = '';
let focusIndex = 0;

/* STORAGE */

try {
    pins = new Set(
        JSON.parse(localStorage.getItem(PIN_KEY) || '[]')
    );
} catch(e) {}

function savePins() {
    try {
        localStorage.setItem(PIN_KEY, JSON.stringify([...pins]));
    } catch(e) {}
}

/* THEME */

function setTheme(theme) {
    document.documentElement.dataset.theme = theme;
    document.getElementById('themeBtn').textContent =
        theme === 'dark' ? '☀' : '☾';

    try {
        localStorage.setItem(THEME_KEY,theme);
    } catch(e) {}
}

let savedTheme = 'dark';

try {
    savedTheme = localStorage.getItem(THEME_KEY) || 'dark';
} catch(e) {}

setTheme(savedTheme);

document.getElementById('themeBtn').onclick = () => {
    setTheme(
        document.documentElement.dataset.theme === 'dark'
        ? 'light' : 'dark'
    );
};

/* CLOCK */

function updateClock() {
    document.getElementById('clock').textContent =
        new Date().toLocaleTimeString([], {
            hour:'2-digit',
            minute:'2-digit'
        });
}

updateClock();
setInterval(updateClock,1000);

/* PARSE CATALOGUE */

function parseCatalogue(raw) {

    const result = [];
    let current = null;

    raw.replace(/^\uFEFF/,'')
       .split(/\r?\n/)
       .forEach(line => {

        line = line.trim();

        if(!line || line.startsWith('#')) return;

        const heading = line.match(/^\[(.+?)\]$/);

        if(heading) {
            current = {
                name:heading[1].trim(),
                items:[]
            };

            result.push(current);
            return;
        }

        if(!current) return;

        const fields = line.split('|').map(x=>x.trim());

        if(fields.length < 2) return;

        const name = fields[0]
            .replace(/^\d+\s*[.)-]\s*/,'')
            .trim();

        const url = fields[1];
        const icon = fields[2] || '';

        try {
            const parsed = new URL(url);

            if(!['https:','http:'].includes(parsed.protocol)) return;

            if(!name) return;

            current.items.push({
                name,
                url,
                icon,
                category:current.name
            });

        } catch(e) {}
    });

    return result.filter(c=>c.items.length);
}

/* ICONS */

const palettes = [
    ['#7867f4','#4d8de8'],
    ['#f06e8b','#cb5dd5'],
    ['#24a99a','#3d83c9'],
    ['#ef9a45','#e45e73'],
    ['#567ee8','#855ddd'],
    ['#26a7c7','#4f75dd'],
    ['#c26bd7','#8063e8'],
    ['#43ad79','#2994ac']
];

function hash(text) {
    let h=0;
    for(let i=0;i<text.length;i++)
        h=(h*31+text.charCodeAt(i))|0;
    return Math.abs(h);
}

function makeIcon(item) {

    const palette =
        palettes[hash(item.name)%palettes.length];

    const icon = document.createElement('div');
    icon.className = 'app-icon';

    icon.style.setProperty('--color1',palette[0]);
    icon.style.setProperty('--color2',palette[1]);

    if(item.icon) {

        const img = document.createElement('img');

        img.src = ICON_BASE + encodeURIComponent(item.icon);
        img.alt = '';
        img.loading = 'lazy';

        img.onerror = () => {
            img.remove();
            icon.textContent = item.name.charAt(0).toUpperCase();
        };

        icon.appendChild(img);

    } else {
        icon.textContent = item.name.charAt(0).toUpperCase();
    }

    return icon;
}

/* CREATE APP TILE */

function makeTile(item) {

    const wrapper = document.createElement('div');
    wrapper.className = 'app-wrap';

    const link = document.createElement('a');

    link.className = 'app-card';
    link.href = item.url;
    link.setAttribute('aria-label','Open '+item.name);

    // Same WebView, not a new browser tab.
    link.target = '_self';

    link.appendChild(makeIcon(item));

    const label = document.createElement('div');
    label.className = 'app-name';
    label.textContent = item.name;

    link.appendChild(label);

    const pin = document.createElement('button');
    pin.className = 'pin';
    pin.textContent = pins.has(item.url)?'★':'☆';
    pin.classList.toggle('active',pins.has(item.url));
    pin.setAttribute('aria-label','Pin '+item.name);

    pin.onclick = e => {
        e.preventDefault();
        e.stopPropagation();

        if(pins.has(item.url)) {
            pins.delete(item.url);
        } else {
            pins.add(item.url);
        }

        savePins();
        renderPins();
        renderLibrary();
    };

    wrapper.append(link,pin);

    return wrapper;
}

/* PINNED */

function renderPins() {

    pinnedGrid.replaceChildren();

    const items = allItems.filter(item=>pins.has(item.url));

    items.forEach(item=>{
        pinnedGrid.appendChild(makeTile(item));
    });

    pinnedSection.classList.toggle(
        'hidden',
        items.length===0 || query.length>0
    );

    document.getElementById('pinnedCount').textContent=items.length;
}

/* CATEGORY NAVIGATION */

function renderCategories() {

    categoryNav.replaceChildren();

    const allBtn = document.createElement('button');

    allBtn.className='category-btn';
    allBtn.textContent='All';
    allBtn.dataset.category='all';

    categoryNav.appendChild(allBtn);

    categories.forEach(category=>{
        const btn=document.createElement('button');

        btn.className='category-btn';
        btn.textContent=category.name;
        btn.dataset.category=category.name;

        categoryNav.appendChild(btn);
    });

    categoryNav.querySelectorAll('button').forEach(btn=>{
        btn.onclick=()=>{
            currentCategory=btn.dataset.category;
            updateCategory();
            renderLibrary();

            if(currentCategory!=='all') {
                document.getElementById(
                    'section-'+categories.findIndex(
                        c=>c.name===currentCategory
                    )
                )?.scrollIntoView({behavior:'smooth'});
            } else {
                window.scrollTo({top:0,behavior:'smooth'});
            }
        };
    });

    updateCategory();
}

function updateCategory() {

    categoryNav.querySelectorAll('button').forEach(btn=>{
        btn.classList.toggle(
            'active',
            btn.dataset.category===currentCategory
        );
    });
}

/* RENDER LIBRARY */

function renderLibrary() {

    library.replaceChildren();

    let visibleTotal=0;

    categories.forEach((category,index)=>{

        if(currentCategory!=='all' &&
           currentCategory!==category.name) return;

        const items=category.items.filter(item=>
            item.name.toLowerCase().includes(query)
        );

        if(!items.length) return;

        visibleTotal+=items.length;

        const section=document.createElement('section');
        section.className='library-section';
        section.id='section-'+index;

        const heading=document.createElement('div');
        heading.className='section-heading';

        const title=document.createElement('h2');
        title.textContent=category.name;

        const count=document.createElement('span');
        count.className='section-count';
        count.textContent=items.length;

        const line=document.createElement('div');
        line.className='section-line';

        heading.append(title,count,line);

        const grid=document.createElement('div');
        grid.className='app-grid';

        items.forEach(item=>{
            grid.appendChild(makeTile(item));
        });

        section.append(heading,grid);
        library.appendChild(section);
    });

    document.getElementById('count').textContent =
        visibleTotal+' ITEMS';

    empty.classList.toggle('hidden',visibleTotal>0);

    renderPins();
}

/* SEARCH */

document.getElementById('searchBtn').onclick=()=>{
    searchArea.classList.toggle('open');

    if(searchArea.classList.contains('open')) {
        search.focus();
    } else {
        search.value='';
        query='';
        renderLibrary();
    }
};

search.addEventListener('input',()=>{
    query=search.value.toLowerCase().trim();
    renderLibrary();
});

/* FETCH GITHUB CATALOGUE */

async function loadLibrary() {

    try {

        const response=await fetch(DATA_URL,{
            cache:'no-store'
        });

        if(!response.ok)
            throw new Error('HTTP '+response.status);

        const raw=await response.text();

        categories=parseCatalogue(raw);

        allItems=categories.flatMap(c=>c.items);

        renderCategories();
        renderLibrary();

        if(!allItems.length) {
            throw new Error('No applications found in catalogue.');
        }

    } catch(error) {

        library.innerHTML=`
        <div class="status">
            <strong>Unable to load library</strong>
            Check your internet connection and GitHub catalogue.
            <br><br>
            ${String(error.message)}
            <br><br>
            <button onclick="location.reload()"
            style="padding:12px 20px;border:0;border-radius:10px;background:#7867ff;color:white">
            Retry
            </button>
        </div>`;

        document.getElementById('count').textContent='ERROR';
    }
}

/* REMOTE NAVIGATION */

function getFocusable() {

    return [
        ...document.querySelectorAll(
            '.header-btn, .category-btn, .app-card, .pin'
        )
    ].filter(el=>{
        return el.offsetParent!==null &&
               !el.closest('.hidden');
    });
}

function setFocus(element) {

    const elements=getFocusable();

    elements.forEach(el=>el.classList.remove('focused'));

    if(!element) return;

    element.classList.add('focused');
    focusIndex=elements.indexOf(element);

    element.scrollIntoView({
        behavior:'smooth',
        block:'nearest',
        inline:'nearest'
    });
}

function currentFocus() {

    const elements=getFocusable();

    return elements.find(el=>el.classList.contains('focused'))
        || elements[0];
}

function moveFocus(direction) {

    const elements=getFocusable();
    const current=currentFocus();

    if(!current) return;

    const a=current.getBoundingClientRect();

    const ax=a.left+a.width/2;
    const ay=a.top+a.height/2;

    let best=null;
    let bestScore=Infinity;

    elements.forEach(el=>{

        if(el===current) return;

        const r=el.getBoundingClientRect();

        const bx=r.left+r.width/2;
        const by=r.top+r.height/2;

        const dx=bx-ax;
        const dy=by-ay;

        let primary,secondary;

        if(direction==='right') {
            if(dx<=5) return;
            primary=dx;
            secondary=Math.abs(dy);
        }

        if(direction==='left') {
            if(dx>=-5) return;
            primary=-dx;
            secondary=Math.abs(dy);
        }

        if(direction==='down') {
            if(dy<=5) return;
            primary=dy;
            secondary=Math.abs(dx);
        }

        if(direction==='up') {
            if(dy>=-5) return;
            primary=-dy;
            secondary=Math.abs(dx);
        }

        const score=primary+secondary*2.2;

        if(score<bestScore) {
            bestScore=score;
            best=el;
        }
    });

    if(best) setFocus(best);
}

function activateFocus() {

    const element=currentFocus();

    if(element) element.click();
}

function goBack() {

    if(document.activeElement===search) {
        search.blur();
        return;
    }

    if(searchArea.classList.contains('open')) {
        searchArea.classList.remove('open');
        search.value='';
        query='';
        renderLibrary();
        return;
    }

    // Return focus to the first navigation control.
    setFocus(document.querySelector('.header-btn'));
}

/* KEYBOARD AND FIRE TV REMOTE */

document.addEventListener('keydown',e=>{

    const key=e.key;

    if(key==='Backspace' || key==='Escape') {
        if(document.activeElement!==search) {
            e.preventDefault();
            e.stopPropagation();
            goBack();
        }
        return;
    }

    if(document.activeElement===search) {

        if(key==='Enter') {
            search.blur();
            e.preventDefault();
        }

        return;
    }

    if(key.startsWith('Arrow')) {

        e.preventDefault();

        const directions={
            ArrowUp:'up',
            ArrowDown:'down',
            ArrowLeft:'left',
            ArrowRight:'right'
        };

        moveFocus(directions[key]);
        return;
    }

    if(key==='Enter' || key===' ') {

        e.preventDefault();

        if(!e.repeat) activateFocus();
    }

});

/* MOUSE FALLBACK */

document.addEventListener('mouseover',e=>{

    const target=e.target.closest(
        '.header-btn,.category-btn,.app-card,.pin'
    );

    if(target) setFocus(target);

});

document.addEventListener('click',e=>{

    const target=e.target.closest(
        '.header-btn,.category-btn,.app-card,.pin'
    );

    if(target && !target.classList.contains('focused')) {
        setFocus(target);
    }

});

/* INITIALIZE */

loadLibrary();

setTimeout(()=>{
    setFocus(document.getElementById('searchBtn'));
},500);

})();
</script>

</body>
</html>
