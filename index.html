
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>360° Planetarium Viewer</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050914;
  font-family: system-ui, sans-serif;
}

#view {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

.hud {
  position: fixed;
  top: 14px;
  left: 14px;
  z-index: 2;
  color: white;
  background: #08101fbb;
  border: 1px solid #ffffff30;
  border-radius: 12px;
  padding: 10px 14px;
  pointer-events: none;
}

.hud strong {
  display: block;
  font-size: 13px;
}

.hud span {
  font-size: 11px;
  color: #bdc9e8;
}

.toolbar {
  position: fixed;
  top: 14px;
  right: 14px;
  z-index: 3;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  flex-wrap: wrap;
  gap: 7px;
  max-width: calc(100vw - 28px);
}

.toolbar button {
  color: white;
  background: #15243b;
  border: 1px solid #ffffff40;
  border-radius: 10px;
  padding: 10px 12px;
  font-weight: bold;
  font-size: 13px;
  cursor: pointer;
  min-width: 38px;
}

.toolbar button:disabled {
  opacity: .35;
  cursor: default;
}

.toolbar button:active:not(:disabled) {
  background: #29486e;
}

.toolbar button.sensor-active {
  background: #15543e;
  border-color: #54d6a1;
}

.size-label {
  color: white;
  background: #101b30;
  min-width: 45px;
  text-align: center;
  padding: 9px 3px;
  border-radius: 8px;
  font-size: 11px;
}

#recenterBtn {
  display: none;
}

#fileInput {
  display: none;
}

.help {
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  background: #101b30dd;
  color: white;
  border-radius: 20px;
  padding: 10px 14px;
  font-size: 11px;
  white-space: nowrap;
  pointer-events: none;
  max-width: 95%;
  text-align: center;
}

#imageStatus {
  position: fixed;
  top: 75px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  color: white;
  background: #101b30ee;
  padding: 8px 13px;
  border-radius: 20px;
  font-size: 11px;
  pointer-events: none;
  display: none;
  max-width: 90%;
  text-align: center;
}

@media (max-width: 600px) {
  .toolbar {
    top: 75px;
    right: 12px;
    gap: 5px;
    max-width: calc(100vw - 24px);
  }

  .toolbar button {
    padding: 9px 10px;
  }

  #imageStatus {
    top: 205px;
  }
}
</style>
</head>

<body>

<canvas id="view"></canvas>

<div class="hud">
  <strong>360° PLANETARIUM</strong>
  <span>First-person spherical image viewer</span>
</div>

<div class="toolbar">

  <button id="importBtn">Import Image</button>

  <button id="smaller" disabled aria-label="Decrease image size">−</button>

  <span class="size-label" id="sizeLabel">100%</span>

  <button id="larger" disabled aria-label="Increase image size">+</button>

  <button id="reset">Reset View</button>

  <button id="sensorBtn">Use Phone</button>

  <button id="recenterBtn">Recenter</button>

</div>

<input type="file" id="fileInput" accept="image/*">

<div id="imageStatus"></div>

<div class="help">
  Drag: Look · Two fingers: Yaw / Roll / Zoom · Phone: Motion View
</div>

<script type="module">

import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ========================================
// RENDERER
// ========================================

const canvas = document.getElementById("view");

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio || 1, 2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.outputColorSpace = THREE.SRGBColorSpace;

// ========================================
// SCENE
// ========================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x07101f);

// ========================================
// FIRST PERSON CAMERA
// ========================================

const camera = new THREE.PerspectiveCamera(
  75,
  window.innerWidth / window.innerHeight,
  0.01,
  100
);

camera.position.set(0, 0, 0);
camera.rotation.order = "YXZ";

// ========================================
// SPHERE SETTINGS
// ========================================

const SPHERE_RADIUS = 20;

const sphereGeometry = new THREE.SphereGeometry(
  SPHERE_RADIUS,
  96,
  64
);

// ========================================
// DEFAULT SPHERE TEXTURE
// ========================================

const texCanvas = document.createElement("canvas");

texCanvas.width = 2048;
texCanvas.height = 1024;

const ctx = texCanvas.getContext("2d");

function drawDefaultTexture() {

  const gradient = ctx.createLinearGradient(
    0, 0, 0, 1024
  );

  gradient.addColorStop(0, "#071329");
  gradient.addColorStop(0.48, "#172d4b");
  gradient.addColorStop(1, "#08101f");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 2048, 1024);

  const glow = ctx.createLinearGradient(
    0, 300, 0, 730
  );

  glow.addColorStop(0, "rgba(67,139,190,0)");
  glow.addColorStop(0.5, "rgba(65,154,190,.25)");
  glow.addColorStop(1, "rgba(67,139,190,0)");

  ctx.fillStyle = glow;
  ctx.fillRect(0, 300, 2048, 430);

  // Grid

  ctx.strokeStyle = "rgba(151,205,239,.2)";
  ctx.lineWidth = 1;

  for (let x = 0; x <= 2048; x += 128) {

    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, 1024);
    ctx.stroke();

  }

  for (let y = 0; y <= 1024; y += 128) {

    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(2048, y);
    ctx.stroke();

  }

  // Stars

  let seed = 92741;

  function random() {

    seed = (seed * 1664525 + 1013904223) >>> 0;

    return seed / 4294967296;

  }

  for (let i = 0; i < 850; i++) {

    const x = random() * 2048;
    const y = random() * 1024;
    const r = 0.35 + random() * 1.25;

    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);

    ctx.fillStyle =
      `rgba(220,238,255,${0.2 + random() * 0.7})`;

    ctx.fill();

  }

}

drawDefaultTexture();

const defaultTexture = new THREE.CanvasTexture(texCanvas);

defaultTexture.colorSpace = THREE.SRGBColorSpace;

// ========================================
// SPHERE MATERIAL
// ========================================

const sphereMaterial = new THREE.MeshBasicMaterial({
  map: defaultTexture,
  side: THREE.BackSide
});

const sphere = new THREE.Mesh(
  sphereGeometry,
  sphereMaterial
);

scene.add(sphere);

// ========================================
// IMAGE IMPORT AND SIZE SETTINGS
// ========================================

const fileInput = document.getElementById("fileInput");

const imageStatus = document.getElementById("imageStatus");

const smallerBtn = document.getElementById("smaller");

const largerBtn = document.getElementById("larger");

const sizeLabel = document.getElementById("sizeLabel");

let importedTexture = null;
let photoPatch = null;
let photoMaterial = null;
let importedImage = null;
let importedAspect = 1;

let importRequest = 0;

// Image size configuration

const BASE_MAX_FOV = 60;

const MAX_ALLOWED_FOV = 110;

const MIN_ALLOWED_FOV = 15;

const SIZE_STEP = 0.10;

const BASE_TANGENT = Math.tan(
  THREE.MathUtils.degToRad(BASE_MAX_FOV / 2)
);

const MIN_SIZE = Math.tan(
  THREE.MathUtils.degToRad(MIN_ALLOWED_FOV / 2)
) / BASE_TANGENT;

const MAX_SIZE = Math.tan(
  THREE.MathUtils.degToRad(MAX_ALLOWED_FOV / 2)
) / BASE_TANGENT;

let imageScale = 1;

// ========================================
// STATUS
// ========================================

function showStatus(message) {

  imageStatus.textContent = message;

  imageStatus.style.display = "block";

  clearTimeout(showStatus.timer);

  showStatus.timer = setTimeout(() => {

    imageStatus.style.display = "none";

  }, 3500);

}

// ========================================
// UPDATE SIZE BUTTONS
// ========================================

function updateSizeControls() {

  const hasPatch = !!photoPatch;

  smallerBtn.disabled =
    !hasPatch || imageScale <= MIN_SIZE + 0.001;

  largerBtn.disabled =
    !hasPatch || imageScale >= MAX_SIZE - 0.001;

  sizeLabel.textContent =
    Math.round(imageScale * 100) + "%";

}

// ========================================
// CLEAR PREVIOUS IMPORT
// ========================================

function clearPreviousImage() {

  if (photoPatch) {

    scene.remove(photoPatch);

    photoPatch.geometry.dispose();

    photoPatch = null;

  }

  if (photoMaterial) {

    photoMaterial.dispose();

    photoMaterial = null;

  }

  if (importedTexture) {

    importedTexture.dispose();

    importedTexture = null;

  }

  importedImage = null;

  sphereMaterial.map = defaultTexture;

  sphereMaterial.needsUpdate = true;

  imageScale = 1;

  updateSizeControls();

}

// ========================================
// BUILD ASPECT-LOCKED SPHERICAL PATCH
// ========================================

function createPhotoGeometry(image, aspect, scale) {

  let baseTanH;
  let baseTanV;

  if (aspect >= 1) {

    baseTanH = BASE_TANGENT;
    baseTanV = BASE_TANGENT / aspect;

  } else {

    baseTanV = BASE_TANGENT;
    baseTanH = BASE_TANGENT * aspect;

  }

  // Same scale applied to both dimensions.

  const tanH = baseTanH * scale;
  const tanV = baseTanV * scale;

  const segmentsX = 160;
  const segmentsY = 160;

  const radius = SPHERE_RADIUS - 0.05;

  const positions = [];
  const uvs = [];
  const indices = [];

  // ======================================
  // MAP IMAGE ONTO SPHERICAL WALL
  // ======================================

  for (let y = 0; y <= segmentsY; y++) {

    const v = y / segmentsY;

    for (let x = 0; x <= segmentsX; x++) {

      const u = x / segmentsX;

      const nx = (u * 2 - 1) * tanH;
      const ny = (1 - v * 2) * tanV;

      const direction = new THREE.Vector3(
        nx,
        ny,
        -1
      ).normalize();

      const point = direction.multiplyScalar(radius);

      positions.push(
        point.x,
        point.y,
        point.z
      );

      // Image stays upright.

      uvs.push(u, 1 - v);

    }

  }

  // ======================================
  // TRIANGULATE CURVED PATCH
  // ======================================

  for (let y = 0; y < segmentsY; y++) {

    for (let x = 0; x < segmentsX; x++) {

      const a = y * (segmentsX + 1) + x;
      const b = a + segmentsX + 1;
      const c = a + 1;
      const d = b + 1;

      indices.push(
        a, b, c,
        b, d, c
      );

    }

  }

  const geometry = new THREE.BufferGeometry();

  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(positions, 3)
  );

  geometry.setAttribute(
    "uv",
    new THREE.Float32BufferAttribute(uvs, 2)
  );

  geometry.setIndex(indices);

  geometry.computeVertexNormals();
  geometry.computeBoundingSphere();

  return geometry;

}

// ========================================
// CREATE PHOTO PATCH
// ========================================

function buildPhotoPatch() {

  if (!importedImage || !importedTexture) return;

  const newGeometry = createPhotoGeometry(
    importedImage,
    importedAspect,
    imageScale
  );

  if (photoPatch) {

    const oldGeometry = photoPatch.geometry;

    photoPatch.geometry = newGeometry;

    oldGeometry.dispose();

  } else {

    photoMaterial = new THREE.MeshBasicMaterial({
      map: importedTexture,
      side: THREE.DoubleSide
    });

    photoPatch = new THREE.Mesh(
      newGeometry,
      photoMaterial
    );

    scene.add(photoPatch);

  }

  updateSizeControls();

}

// ========================================
// PLUS / MINUS SIZE CONTROLS
// ========================================

function changeImageSize(direction) {

  if (!photoPatch) return;

  imageScale += direction * SIZE_STEP;

  imageScale = THREE.MathUtils.clamp(
    imageScale,
    MIN_SIZE,
    MAX_SIZE
  );

  imageScale = Math.round(imageScale * 1000) / 1000;

  buildPhotoPatch();

  showStatus(
    "Image size: " +
    Math.round(imageScale * 100) +
    "%"
  );

}

smallerBtn.addEventListener("click", () => {
  changeImageSize(-1);
});

largerBtn.addEventListener("click", () => {
  changeImageSize(1);
});

// ========================================
// IMPORT IMAGE
// ========================================

document.getElementById("importBtn").addEventListener(
  "click",
  () => fileInput.click()
);

fileInput.addEventListener("change", e => {

  const file = e.target.files[0];

  if (!file) return;

  if (!file.type.startsWith("image/")) {

    showStatus("Please select a valid image.");

    fileInput.value = "";

    return;

  }

  const requestNumber = ++importRequest;

  const imageURL = URL.createObjectURL(file);

  const image = new Image();

  image.onload = () => {

    if (requestNumber !== importRequest) {

      URL.revokeObjectURL(imageURL);

      return;

    }

    try {

      clearPreviousImage();

      importedImage = image;

      importedAspect =
        image.naturalWidth / image.naturalHeight;

      importedTexture = new THREE.Texture(image);

      importedTexture.colorSpace = THREE.SRGBColorSpace;

      importedTexture.anisotropy =
        renderer.capabilities.getMaxAnisotropy();

      importedTexture.needsUpdate = true;

      // All images use the same curved projection.

      imageScale = 1;

      buildPhotoPatch();

      showStatus(
        "Curved image loaded · " +
        image.naturalWidth + " × " +
        image.naturalHeight
      );

    } catch (error) {

      console.error(error);

      clearPreviousImage();

      showStatus("Image projection failed.");

    }

    URL.revokeObjectURL(imageURL);

  };

  image.onerror = () => {

    URL.revokeObjectURL(imageURL);

    if (requestNumber === importRequest) {

      showStatus("Unable to load image.");

    }

  };

  image.src = imageURL;

  fileInput.value = "";

});

// ========================================
// CAMERA ROTATION
// ========================================

let yaw = 0;
let pitch = 0;
let roll = 0;

const START_FOV = 75;

function clampPitch(value) {

  const limit = Math.PI / 2 - 0.015;

  return Math.max(
    -limit,
    Math.min(limit, value)
  );

}

function updateCamera() {

  camera.rotation.order = "YXZ";

  camera.rotation.y = yaw;
  camera.rotation.x = pitch;
  camera.rotation.z = roll;

}

// ========================================
// PHONE SENSOR CONTROL
// ========================================

// DeviceOrientation provides the phone's fused
// orientation using its motion sensors.
//
// This is preferable to manually adding up raw
// gyroscope readings, which can drift over time.
//
// A proximity sensor is not required.

const sensorBtn = document.getElementById("sensorBtn");

const recenterBtn = document.getElementById("recenterBtn");

let sensorActive = false;
let sensorReferenceReady = false;
let sensorTimeout = null;

let latestDeviceQuaternion = new THREE.Quaternion();

const deviceEuler = new THREE.Euler();

const deviceQuaternion = new THREE.Quaternion();

const sensorReferenceQuaternion = new THREE.Quaternion();

const sensorReferenceCameraQuaternion = new THREE.Quaternion();

const inverseSensorReference = new THREE.Quaternion();

const sensorDeltaQuaternion = new THREE.Quaternion();

const screenQuaternion = new THREE.Quaternion();

const deviceCameraCorrection = new THREE.Quaternion(
  -Math.sqrt(0.5),
  0,
  0,
  Math.sqrt(0.5)
);

const deviceZAxis = new THREE.Vector3(0, 0, 1);

// ========================================
// GET SCREEN ORIENTATION
// ========================================

function getScreenOrientationAngle() {

  if (
    screen.orientation &&
    Number.isFinite(screen.orientation.angle)
  ) {

    return screen.orientation.angle;

  }

  return Number(window.orientation) || 0;

}

// ========================================
// CONVERT DEVICE ORIENTATION TO QUATERNION
// ========================================

function makeDeviceQuaternion(event) {

  if (
    !Number.isFinite(event.alpha) ||
    !Number.isFinite(event.beta) ||
    !Number.isFinite(event.gamma)
  ) {

    return false;

  }

  const alpha = THREE.MathUtils.degToRad(event.alpha);

  const beta = THREE.MathUtils.degToRad(event.beta);

  const gamma = THREE.MathUtils.degToRad(event.gamma);

  const screenAngle = THREE.MathUtils.degToRad(
    getScreenOrientationAngle()
  );

  // Standard device orientation conversion.

  deviceEuler.set(
    beta,
    alpha,
    -gamma,
    "YXZ"
  );

  deviceQuaternion.setFromEuler(deviceEuler);

  deviceQuaternion.multiply(deviceCameraCorrection);

  screenQuaternion.setFromAxisAngle(
    deviceZAxis,
    -screenAngle
  );

  deviceQuaternion.multiply(screenQuaternion);

  return true;

}

// ========================================
// DEVICE ORIENTATION EVENT
// ========================================

function handleDeviceOrientation(event) {

  if (!sensorActive) return;

  if (!makeDeviceQuaternion(event)) return;

  latestDeviceQuaternion.copy(deviceQuaternion);

  // First sensor reading establishes the reference.
  // The camera does not jump when sensors activate.

  if (!sensorReferenceReady) {

    sensorReferenceQuaternion.copy(deviceQuaternion);

    sensorReferenceCameraQuaternion.copy(
      camera.quaternion
    );

    sensorReferenceReady = true;

    if (sensorTimeout) {

      clearTimeout(sensorTimeout);

      sensorTimeout = null;

    }

    showStatus(
      "Phone view active. Move your phone to look around."
    );

    return;

  }

  // Calculate phone rotation relative to activation.

  inverseSensorReference
    .copy(sensorReferenceQuaternion)
    .invert();

  sensorDeltaQuaternion
    .copy(deviceQuaternion)
    .multiply(inverseSensorReference);

  // Apply relative movement to the camera's
  // original viewing direction.

  camera.quaternion
    .copy(sensorDeltaQuaternion)
    .multiply(sensorReferenceCameraQuaternion);

}

// ========================================
// SYNC CAMERA BACK TO TOUCH CONTROLS
// ========================================

function syncGestureAnglesFromCamera() {

  camera.rotation.order = "YXZ";

  camera.rotation.setFromQuaternion(
    camera.quaternion,
    "YXZ"
  );

  yaw = camera.rotation.y;
  pitch = camera.rotation.x;
  roll = camera.rotation.z;

}

// ========================================
// STOP PHONE SENSOR CONTROL
// ========================================

function stopPhoneSensors() {

  if (sensorTimeout) {

    clearTimeout(sensorTimeout);

    sensorTimeout = null;

  }

  window.removeEventListener(
    "deviceorientation",
    handleDeviceOrientation,
    true
  );

  sensorActive = false;
  sensorReferenceReady = false;

  sensorBtn.textContent = "Use Phone";

  sensorBtn.classList.remove("sensor-active");

  recenterBtn.style.display = "none";

  // Preserve the last sensor-controlled view.
  // Touch controls continue from that position.

  syncGestureAnglesFromCamera();

}

// ========================================
// ENABLE PHONE SENSOR CONTROL
// ========================================

async function startPhoneSensors() {

  if (!("DeviceOrientationEvent" in window)) {

    showStatus(
      "This browser does not support device orientation."
    );

    return;

  }

  if (!window.isSecureContext) {

    showStatus(
      "Phone sensors require a secure HTTPS connection."
    );

    return;

  }

  sensorBtn.disabled = true;

  try {

    // iOS Safari requires permission from a user gesture.

    if (
      typeof DeviceOrientationEvent.requestPermission ===
      "function"
    ) {

      const permission =
        await DeviceOrientationEvent.requestPermission();

      if (permission !== "granted") {

        throw new Error("Motion sensor permission was denied.");

      }

    }

    sensorReferenceReady = false;

    sensorActive = true;

    sensorBtn.textContent = "Phone: ON";

    sensorBtn.classList.add("sensor-active");

    recenterBtn.style.display = "inline-block";

    // Listen for the fused device orientation.

    window.addEventListener(
      "deviceorientation",
      handleDeviceOrientation,
      true
    );

    showStatus("Waiting for phone motion sensors...");

    // Detect browsers that never deliver sensor readings.

    sensorTimeout = setTimeout(() => {

      if (sensorActive && !sensorReferenceReady) {

        stopPhoneSensors();

        showStatus(
          "No sensor data received. Check browser permissions and HTTPS."
        );

      }

    }, 5000);

  } catch (error) {

    console.error(error);

    stopPhoneSensors();

    showStatus(
      error.message || "Unable to activate phone sensors."
    );

  } finally {

    sensorBtn.disabled = false;

  }

}

// ========================================
// RECENTER PHONE VIEW
// ========================================

function recenterPhoneView() {

  if (!sensorActive || !sensorReferenceReady) {

    showStatus("Phone sensors are not ready.");

    return;

  }

  // The phone's current physical position becomes
  // the new reference without changing the view.

  sensorReferenceQuaternion.copy(
    latestDeviceQuaternion
  );

  sensorReferenceCameraQuaternion.copy(
    camera.quaternion
  );

  showStatus("View recentered.");

}

// ========================================
// SENSOR BUTTON
// ========================================

sensorBtn.addEventListener("click", () => {

  if (sensorActive) {

    stopPhoneSensors();

    showStatus("Phone sensor control disabled.");

  } else {

    startPhoneSensors();

  }

});

recenterBtn.addEventListener(
  "click",
  recenterPhoneView
);

// ========================================
// TOUCH TRACKING
// ========================================

const pointers = new Map();

let lastOne = null;
let lastCenterX = null;
let lastDistance = null;
let lastPairAngle = null;

function getPairMetrics() {

  const points = [...pointers.values()];

  if (points.length < 2) return null;

  const dx = points[1].x - points[0].x;

  const dy = points[1].y - points[0].y;

  return {

    centerX: (points[0].x + points[1].x) / 2,

    distance: Math.hypot(dx, dy),

    angle: Math.atan2(dy, dx)

  };

}

// ========================================
// POINTER DOWN
// ========================================

canvas.addEventListener("pointerdown", e => {

  // Phone motion controls take over looking.

  if (sensorActive) return;

  e.preventDefault();

  canvas.setPointerCapture(e.pointerId);

  pointers.set(e.pointerId, {
    x: e.clientX,
    y: e.clientY
  });

  if (pointers.size === 1) {

    lastOne = {
      x: e.clientX,
      y: e.clientY
    };

    lastCenterX = null;
    lastDistance = null;
    lastPairAngle = null;

  }

  if (pointers.size >= 2) {

    const m = getPairMetrics();

    lastCenterX = m.centerX;
    lastDistance = m.distance;
    lastPairAngle = m.angle;

    lastOne = null;

  }

}, { passive: false });

// ========================================
// POINTER MOVE
// ========================================

canvas.addEventListener("pointermove", e => {

  if (sensorActive) return;

  if (!pointers.has(e.pointerId)) return;

  e.preventDefault();

  pointers.set(e.pointerId, {
    x: e.clientX,
    y: e.clientY
  });

  // ONE FINGER: LOOK AROUND

  if (pointers.size === 1 && lastOne) {

    const p = pointers.get(e.pointerId);

    const dx = p.x - lastOne.x;
    const dy = p.y - lastOne.y;

    yaw += dx * 0.005;

    pitch = clampPitch(
      pitch + dy * 0.005
    );

    lastOne = p;

    updateCamera();

  }

  // TWO FINGERS: YAW, ROLL AND ZOOM

  else if (pointers.size >= 2) {

    const m = getPairMetrics();

    if (
      lastCenterX !== null &&
      lastDistance !== null &&
      lastPairAngle !== null
    ) {

      // HORIZONTAL SLIDE = YAW

      yaw +=
        (m.centerX - lastCenterX) * 0.006;

      // TWIST = ROLL

      let angleDelta =
        m.angle - lastPairAngle;

      while (angleDelta > Math.PI) {

        angleDelta -= Math.PI * 2;

      }

      while (angleDelta < -Math.PI) {

        angleDelta += Math.PI * 2;

      }

      roll += angleDelta;

      // PINCH APART = ZOOM IN
      // PINCH TOGETHER = ZOOM OUT

      const distanceDelta =
        m.distance - lastDistance;

      camera.fov = THREE.MathUtils.clamp(
        camera.fov - distanceDelta * 0.045,
        28,
        105
      );

      camera.updateProjectionMatrix();

      updateCamera();

    }

    lastCenterX = m.centerX;
    lastDistance = m.distance;
    lastPairAngle = m.angle;

  }

}, { passive: false });

// ========================================
// POINTER RELEASE
// ========================================

function endPointer(e) {

  pointers.delete(e.pointerId);

  if (pointers.size === 1) {

    const p = [...pointers.values()][0];

    lastOne = {
      x: p.x,
      y: p.y
    };

    lastCenterX = null;
    lastDistance = null;
    lastPairAngle = null;

  }

  else if (pointers.size === 0) {

    lastOne = null;

    lastCenterX = null;

    lastDistance = null;

    lastPairAngle = null;

  }

  else {

    const m = getPairMetrics();

    lastCenterX = m.centerX;

    lastDistance = m.distance;

    lastPairAngle = m.angle;

  }

}

canvas.addEventListener("pointerup", endPointer);

canvas.addEventListener("pointercancel", endPointer);

canvas.addEventListener("lostpointercapture", endPointer);

// ========================================
// MOUSE WHEEL ZOOM
// ========================================

canvas.addEventListener("wheel", e => {

  e.preventDefault();

  camera.fov = THREE.MathUtils.clamp(
    camera.fov + e.deltaY * 0.035,
    28,
    105
  );

  camera.updateProjectionMatrix();

}, { passive: false });

// ========================================
// RESET CAMERA VIEW
// ========================================

document.getElementById("reset").addEventListener(
  "click",
  () => {

    yaw = 0;
    pitch = 0;
    roll = 0;

    camera.fov = START_FOV;

    camera.updateProjectionMatrix();

    updateCamera();

    // If phone control is active, make the
    // current phone orientation the new baseline.

    if (sensorActive && sensorReferenceReady) {

      sensorReferenceQuaternion.copy(
        latestDeviceQuaternion
      );

      sensorReferenceCameraQuaternion.copy(
        camera.quaternion
      );

    }

  }
);

// ========================================
// RESIZE
// ========================================

window.addEventListener("resize", () => {

  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});

// ========================================
// RENDER LOOP
// ========================================

function animate() {

  requestAnimationFrame(animate);

  renderer.render(scene, camera);

}

updateCamera();

animate();

</script>

</body>
</html>
